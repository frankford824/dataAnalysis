# 模板：把某一种表头长相绑定到字段角色上。
#
# 全部照实测的表头写，列名一个字都不能改——实测过一次别人把「线上子订单编号」
# 写成「线上子订单号」，少一个「编」字，结果订单级成本覆盖率直接掉到 0。
#
# 这批文件的表头在第 2 行，第 1 行是人手写的公式说明，所以 header_row 都是 1。

# ======================================================================== #
# 脊柱
# ======================================================================== #
- id: taobao_order_detail_v1
  source: order_detail
  name: 淘宝订单明细（千牛宝贝明细）
  match_columns: [子订单编号, 主订单编号, 买家实付金额, 退款金额, 商品ID, 物流单号]
  parse: {header_row: 1}
  total_row_marker: sub_order_id
  time_slots: {order_date: order_time, pay_date: pay_time}
  bindings:
    - {role: sub_order_id, columns: [子订单编号]}
    - {role: order_id, columns: [主订单编号]}
    - {role: buyer_paid, columns: [买家实付金额]}
    - {role: refund_amount, columns: [退款金额]}
    - {role: refund_status, columns: [退款状态], required: false}
    - {role: order_time, columns: [订单创建时间]}
    - {role: pay_time, columns: [订单付款时间], required: false}
    - {role: product_id, columns: [商品ID]}
    - {role: tracking_no, columns: [物流单号], required: false}
    # 收入分配率是他们表里算好的一列。引擎自己也能算（子订单收入/主订单收入），
    # 这里先读现成的，好处是能逐行对齐验证分摊逻辑有没有做对。
    - {role: alloc_ratio, columns: [收入分配率], required: false}
  note: >
    一行一个子订单，子订单编号行级唯一。一个主订单可能有多个子订单，
    所以主订单级的钱（对账、运费、代发、补发）必须分摊，不能直接挂。

- id: douyin_order_detail_v1
  source: order_detail
  name: 抖音订单明细（订单管理导出）
  match_columns: [主订单编号, 子订单编号, 商品ID, 选购商品, 订单应付金额]
  parse: {header_row: 1}
  total_row_marker: sub_order_id
  time_slots: {order_date: order_time}
  bindings:
    - {role: sub_order_id, columns: [子订单编号]}
    - {role: order_id, columns: [主订单编号]}
    - {role: order_time, columns: [订单提交时间]}
    - {role: product_id, columns: [商品ID]}
    - {role: buyer_paid, columns: [订单应付金额]}
    - {role: quantity, columns: [商品数量], required: false}
    - {role: tracking_no, columns: [快递单号], required: false}
  note: >
    抖店的对账表本身就是子订单级，所以抖音这条链路不需要收入分配率——
    这也解释了分配率为什么存在：它是淘宝对账表只到主订单级才需要的补丁。

- id: jd_order_detail_v1
  source: order_detail
  name: 京东订单明细（交易-订单列表导出）
  match_columns: [订单号, 商品ID, 订购数量, 商家应收, 订单状态, 商家SKUID]
  parse: {header_row: 1}
  total_row_marker: order_id
  time_slots: {order_date: order_time, pay_date: pay_time}
  bindings:
    - {role: order_id, columns: [订单号]}
    - {role: product_id, columns: [商品ID]}
    - {role: product_name, columns: [商品名称], required: false}
    - {role: quantity, columns: [订购数量], required: false}
    # 京东的三个金额列：订单金额是买家看到的总价，应付金额是买家实付，商家应收是
    # 平台答应给店铺的钱。取商家应收——它和对账表里的货款是同一个口径，实测按订单
    # 去重后 65,229.54，对账表算出来的交易收款 65,000.93，差的 0.35% 是退掉的单。
    - {role: buyer_paid, columns: [商家应收]}
    - {role: order_state, columns: [订单状态], required: false}
    - {role: order_time, columns: [下单时间]}
    - {role: pay_time, columns: [付款确认时间], required: false}
  note: >
    没有主子订单结构，也没有运单号那一列。一个订单号占若干行（一行一个商品，
    实测 3,726 行 2,981 个订单，最多一单 25 行），所以订单级的钱要按行数均分。

    没有运单号意味着运费只能靠聚水潭回查：运费表的取键规则链第二环（查订单明细的
    物流单号）对这个平台永远落空，第三环（查聚水潭的快递单号）才是实际生效的那条。
    这和京东自己的规则表写的一致——它的运费回查只写了聚水潭这一条。

- id: pdd_order_detail_v1
  source: order_detail
  name: 拼多多订单明细（发货管理-订单查询导出）
  match_columns: [订单号, 商品id, 商家实收金额(元), 用户实付金额(元), 快递单号]
  parse: {header_row: 1}
  total_row_marker: order_id
  time_slots: {order_date: order_time}
  bindings:
    - {role: order_id, columns: [订单号]}
    - {role: product_id, columns: [商品id]}
    - {role: product_name, columns: [商品], required: false}
    - {role: quantity, columns: ["商品数量(件)"], required: false}
    - {role: buyer_paid, columns: ["商家实收金额(元)"]}
    - {role: sku, columns: [商家编码-规格维度], required: false}
    - {role: order_state, columns: [订单状态], required: false}
    - {role: tracking_no, columns: [快递单号], required: false}
    - {role: order_time, columns: [订单成交时间]}
  time_fallbacks:
    - slot: order_date
      from_role: order_id
      extract: '^(\d{6})-'
      format: '%y%m%d'
      note: 订单号前六位就是下单日期
  note: >
    一行一个订单，订单号行级唯一（实测 2,297 行 2,297 个订单号）。所以订单级的钱
    直接挂，不用分摊——这也正是它的规则表里对账那几项没有除以 countifs 的原因。

    成交时间那一列有 127 行是空的，同一行的发货时间和确认收货时间也空着，
    三列全空。规则表在这张表的说明里写了一句「订单成交时间所在列位置有变」，
    这个导出的时间列本来就不稳。没有账期的订单会落进一个「无账期」的店期，
    等于从这个月的损益表上消失，而消失的金额一处都不报错——这个月是 127 单。

    所以账期从订单号兜底。依据不是猜：订单号形如 260531-607198974342268，
    前六位是下单日期，实测有成交时间的 2,170 行里 2,167 行两者完全一致，
    差的 3 行是临近午夜下的单。

    表里有子订单收入、主订单收入、收入分配率三列，整列是空的。那是照淘宝那张表
    抄过来的表头，拼多多这个导出没有主子订单结构，不要绑，绑了会让分摊逻辑
    以为有分配率可用。

- id: alibaba1688_order_detail_v1
  source: order_detail
  name: 1688 订单明细（已卖出货品导出）
  match_columns: [订单号, 买家公司名称, 货品总价, 实付款（元）, 运单号]
  parse: {header_row: 1}
  total_row_marker: order_id
  time_slots: {order_date: order_time, pay_date: pay_time}
  bindings:
    # 表里有两列都叫「订单号」：第 1 列是平台导出的，一个订单占若干行、订单号是
    # 合并单元格；第 2 列是人工把它展开填充后贴过来的副本，表头里写着
    # 「注：商品订单号和结算价把合并单元格展开并填充」。
    # 取第 1 列——引擎读 xlsx 时已经按合并区域把值还原到每一行了，不需要那份副本。
    - {role: order_id, columns: [订单号], occurrence: 0}
    - {role: order_time, columns: [订单创建时间]}
    - {role: pay_time, columns: [订单付款时间], required: false}
    - {role: buyer_paid, columns: [实付款（元）]}
    - {role: quantity, columns: [数量], required: false}
    - {role: sku, columns: [货号], required: false}
    - {role: product_id, columns: [Offer_ID], required: false}
    - {role: tracking_no, columns: [运单号], required: false}
  note: >
    1688 没有主子订单结构，订单号一列出现两次（合并单元格展开留下的），
    取第一次出现。同一个订单号会有多行（多个货品），所以订单级的钱要按行数均分。

# ======================================================================== #
# 对账：两个资金渠道，两条规则链
# ======================================================================== #
- id: taobao_settlement_alipay_v1
  source: settlement
  name: 淘宝对账-支付宝账务明细
  match_columns: [账务流水号, 业务流水号, 业务描述, 业务基础订单号, 商户订单号]
  parse: {header_row: 1}
  sign: as_is
  time_slots: {settle_date: settle_time}
  bindings:
    - {role: txn_id, columns: [账务流水号]}
    - {role: subject, columns: [业务描述]}
    - {role: income, columns: ["收入金额（+元）"]}
    - {role: outgo, columns: ["支出金额（-元）"]}
    - {role: base_order_id, columns: [业务基础订单号], required: false}
    - {role: merchant_order_id, columns: [商户订单号], required: false}
    - {role: remark, columns: [备注], required: false}
    - {role: biz_type, columns: [业务类型], required: false}
    - {role: settle_time, columns: [发生时间]}
  # 取订单号的 7 条规则，照他们表里写的条件 1-7 逐条落下来。
  key_rules:
    - when:
        field: remark
        contains:
          - 余利宝-基金申购
          - 支付宝转入
          - 万相台无界版自动充值
          - 超过消费券封顶金额的平台出资合作费用
          - 保险理赔-本地退赔款
          - 转出到网商银行
          - 太保产险苏州本地退赔款
      exclude: true
      note: >
        这些不是经营流水，显式排除而不是让它挂不上订单混在异常里。
        必须排在链条最前面：排在后面的话，前面那条「括号里的数字」规则会先给它们
        抓个订单号出来，排除就永远轮不到。实测消费券封顶那 25 行就是这么混进
        软件服务费的，多算 3,998.27 元。
    - when: {field: base_order_id, extract: '^(\d{10,25})$'}
      note: >
        业务基础订单号有值就用它，但整格必须是纯数字——这一列偶尔放的不是订单号。

        实测两家店的「记账本转账」（支付宝转账小额打款给买家）共 105 行，这一格写的是
        FP301_8587437774500402 这样的打款流水号，一个订单号也不是。无条件采用的后果
        不是挂不上，是挂着一个永远挂不上的键，落进「订单号取到了、只是订单不在本期」
        那一桶——而真订单号就在备注里（关联订单号：***），下面第 6 条一条全收。
        天猫皇莉诗 2026-06 是 45 行 -326.59 元，喜必顺那份 32 行共 -214.87 元。

        另有 1 行物流赔付的这一格写着运单号 LW1078188993（+19.30），备注里的
        货值赔付(TTSP202607015720014) 也不是订单号，加了这条限制之后它老实落进
        「取不出订单号」。那是实话：这一行确实没带订单号。
    - when: {field: merchant_order_id, extract: 'T\d{3}P(\d{10,25})'}
      note: 商户订单号形如 T200P****** 时取后半段
    - when: {field: remark, extract: '订单号[：:]\s*(\d{10,25})'}
      note: 备注里「交易单号：***，订单号：***」取订单号
    - when: {field: remark, extract: '订单编号[：:]\s*(\d{10,25})'}
      note: 备注里「订单编号：***」
    - when: {field: remark, extract: '关联订单号[：:]\s*(\d{10,25})'}
      note: 支付宝转账小额打款写的是「关联订单号：***」
    - when: {field: remark, extract: '交易单号[：:]\s*(\d{10,25})'}
      note: >
        集运费的备注是「代扣款（扣款用途：商家集运物流服务费，运单号：***，
        交易单号：***，付款方：***）」，订单号藏在「交易单号」这个说法下面。
        规则链原先只认「订单号」「订单编号」，4,398 行集运费全挂不上订单。
        它必须排在运单号回查前面：这些行运单号和交易单号都有，
        直接取交易单号一步到位，回查聚水潭那条只有九成五挂不上。
    - when: {field: remark, extract: 'tradeid[：:]\s*(\d{15,25})'}
      note: >
        淘宝联盟（阿里妈妈）的佣金代扣，备注是「代扣款（扣款用途：淘宝联盟佣金代扣
        tradeid:*** memberid:***）」，订单号藏在 tradeid 这个英文说法下面。
        规则链前面七条只认中文说法，实测皇莉诗 408 行代扣全都挂不上订单——
        408 行里 408 行都带 tradeid，一条规则全收。

        金额很碎（净 -206.05 元），但笔数在「取不出订单号，要查归属」里排第一，
        这一桶是拦着结账的，几百笔查不动的碎账会让人学会无视整个提示。
    - when: {field: remark, extract: '[{(（]\s*(\d{15,25})\s*[})）]'}
      note: 备注里用括号或花括号括起来的订单号
    - when: {field: remark, extract: '运单号[：:]\s*([A-Za-z0-9]{6,30})'}
      via: {source: order_cost, match: tracking_no, take: original_order_id}
      note: 只给运单号不给交易单号的行，去聚水潭回查原始线上订单号
  # 归类规则链。第一条命中的生效。
  #
  # 对齐的是对账表里的「费项2」列，不是「费项」列。这两列是同一张表上的两套归类，
  # 而且互相打架：11,407 行费项说「服务费」费项2说「营销费用」，
  # 4,442 行费项说「营销支出」费项2说「软件服务费」，
  # 4,370 行集运费费项说「物流运费」费项2说「软件服务费」。
  #
  # 为什么跟旧的那套：损益表的 SUMIFS 公式引用的是「对账表内软件服务费」「交易收款」
  # 「交易赔付」这些名字，全是费项2 的取值——费项那一列里对应的叫「服务费」「销售收入」。
  # 也就是说公司现在出的账走的是费项2。引擎要能对上现有账，就得先复现它。
  #
  # 但费项那一套在业务上更站得住：「营销支出-消费券代付资金扣回」平台自己写明是营销支出、
  # 「商家集运物流服务费」是物流费被「服务费」三个字带偏。看着像是有人已经发现并订正了，
  # 只是损益表公式还指着旧列。两套口径差 20,219 行、约 39,574 元，
  # 归到哪个大类会变，毛利不变。这件事记在自检里让人决定，不由引擎替业务改口径。
  classify_rules:
    # 保证金那几条腿，钱在自己账户之间挪的不进损益，真赔出去的才进。这两条排除规则
    # 对应的是对账表公式说明里的条件 8：「如备注项为保证金解冻/天猫保证金-充值（代扣）
    # 则清楚对应费项单元格内容」。
    #
    # 「为」是精确相等，不是包含，这一点差别很大。出账缴存这个科目下面是两种钱，
    # 靠备注有没有赔付原因后缀区分，人工表也是这么分的（喜必顺那份表里费项2 那一列
    # 自己写着）：
    #   备注 = 天猫保证金-充值（代扣）              107 行 -1,857.83  费项2 空着，不算
    #   备注 = 天猫保证金-充值（代扣）-延迟发货 等     27 行   -150.02  费项2 交易赔付，算
    # 前者是余额搬进保证金账户，纯划转；后者是平台按这个原因赔了买家、再从余额把保证金
    # 补回来，钱是真出去了。按科目名一刀切成不算，会把这 27 行真赔付一起丢掉；
    # 一刀切成都算，天猫皇莉诗 2026-06 会多出 -2,090.32 元不存在的赔付
    # （那份表 302 行里 238 行是纯充值、64 行带原因）。
    #
    # 同理「缴存」两个字也不能一概而论：保证金-天猫-缴存的备注是「天猫保证金-商家保证金
    # 理赔」，那是赔出去的钱，仍归交易赔付。判断依据一律是备注，不是科目名里的字。
    #
    # 两条都必须排在字典前面：它们的业务描述（保证金-天猫-扣除转移、保证金-天猫-出账缴存）
    # 在字典里都查得到，字典一命中就轮不到排除了。
    - when: {field: remark, contains: [天猫保证金-解冻]}
      exclude: true
      note: >
        解冻是钱从保证金账户回到余额，资产科目之间挪，费项为空。
        关键词要带横杠：实际备注是「天猫保证金-解冻-null」，
        原先写的「保证金解冻」四个字连着，255 行一直没排掉。
    - when: {field: remark, equals: [天猫保证金-充值（代扣）]}
      exclude: true
      note: >
        充值是钱从余额搬进保证金账户，和解冻是同一件事的反方向，费项一样要清空。
        这条规则原先没有，于是天猫皇莉诗 2026-06 多出 -2,090.32 元的交易赔付
        （报表上那一项本来只有 -267.80），喜必顺 2026-05 多 -1,857.83。

        必须写 equals 而不是 contains。带赔付原因后缀的那些（充值（代扣）-延迟发货、
        -物流轨迹超时、-邮费争议 …）是平台按这个原因赔了买家、再从余额把保证金补回来，
        钱真出去了，人工表也算它（费项2 写的是交易赔付）。contains 会把那 27 行
        -150.02 一起排掉——排掉的是真成本，而账面上只表现为利润高一点。
    - dictionary: true
      note: 查科目字典（业务描述 → 口径项）
    - when:
        field: remark
        contains: [先用后付技术服务费, 消费者体验提升计划服财务费, 消费者体验提升计划服务费,
                   淘宝天猫跨境服务增值费, 超过消费券封顶金额的平台出资合作费用]
      major: software_fee
      note: >
        注意「服财务费」这个写法：支付宝导出的业务描述里「服务费」被污染成
        「服财务费」，微信同一科目拼写正常。两种写法都要认。
    - when:
        field: remark
        contains: [品牌新享, 限时红包代商家垫付扣回]
      major: marketing_fee
      note: >
        费项2 归营销费用。费项那一列归服务费，见上面的口径分歧说明。

        按「品牌新享」前缀一条盖住，不再逐个列举。字典里 12 条品牌新享开头的科目
        全都是营销费用，逐个列举只是把同一件事写两遍，还漏掉了新出的那几种——
        天猫皇莉诗这张表里「品牌新享-天猫营销托管软件服务费」有 2 行业务描述为空，
        字典查不到、列举里也没有，就落在未归类里。
    - when: {field: remark, contains: [商家集运中转操作费, 商家集运物流服务费]}
      major: software_fee
      note: 费项2 归软件服务费。费项那一列归物流运费，业务上后者更合理。
    - when: {field: remark, contains: [万相台无界版自动充值]}
      major: ad_topup
      note: 万相台充值是预付，不是当期费用
    - when: {field: remark, contains: [商家集运物流责任货值赔付, 基金代发任务,
                                       保险理赔-本地退赔款, 太保产险苏州本地退赔款]}
      major: trade_compensation
      note: >
        集运货值赔付原先归物流运费，业务改口径到交易赔付。这一改「平台物流费」
        那一行就没有来源了——对账表里本来也没有物流运费这个大类，
        它一直是靠这条规则单独撑着的。指标留着，值恒为 0。
    - when: {field: remark, contains: [余利宝, 转出到网商银行, 转入到网商银行]}
      exclude: true
      note: >
        理财申购与银行间调拨，钱换了个存放地方，不是损益。
        实测余利宝申购 88 行 81.30 万、转出网商银行 1 行 1.30 万，
        之前一直挂在未归类里拦着结账。
    - when: {field: merchant_order_id, contains: [MYBK]}
      exclude: true
      note: >
        钱从网商银行回来的那条腿。备注只写两个字「退回」，上面按备注排除的规则
        一条都碰不到它，于是天猫皇莉诗有 49,246.16 元卡在未归类里——比这张表上
        所有其他未归类加起来还多两百倍。

        判据是商户订单号里的 MYBK（网商银行的清算标识），不是金额也不是日期：
        实测这两张对账表里带 MYBK 的一共 3 行，全都是网商银行的进出腿
        （皇莉诗 -500,000 转出、+49,246.16 退回，喜必顺 -13,000 转出），
        没有一行是经营流水。
    - when: {field: remark, contains: [淘宝联盟佣金代扣, 淘宝联盟推广佣金返还]}
      major: marketing_fee
      note: >
        淘宝联盟（阿里妈妈）的推广佣金，代扣是支出、返还是冲回，同一个口径两个方向。
        实测皇莉诗 450 行、净 -181 元，笔数不小金额很碎；不归类的话它们既进不了
        损益表也算不进覆盖率，只是让未归类的笔数一直挂着。
    - when: {field: remark, contains: [售后退款追缴消费券返还金额]}
      major: marketing_fee
      note: >
        售后退款时平台把先前返还的消费券追回来，是营销费用的冲回。
        本月只有 1 行 0.92 元，但归类了就一直认得。
    # 业务描述为空的行靠业务类型兜底。实测支付宝有 28,615 行业务描述为空，
    # 其中「交易分账」11,462 行是营销费用的主要来源，只查字典会整块丢掉。
    - when: {field: biz_type, equals: [交易分账]}
      major: marketing_fee
      note: 业务描述为空的交易分账，按营销费用处理

- id: taobao_settlement_wechat_v1
  source: settlement
  name: 淘宝对账-微信账单
  match_columns: [商家昵称, 支付流水号, 主订单id, 子订单id, 入帐类型]
  parse: {header_row: 1}
  sign: as_is
  time_slots: {settle_date: settle_time}
  bindings:
    - {role: txn_id, columns: [支付流水号]}
    - {role: subject, columns: [业务描述], required: false}
    - {role: income, columns: ["收入金额(元)"]}
    # 列名把符号约定写在括号里了：支付宝叫「支出金额（-元）」带减号、值是负数，
    # 微信叫「支出金额(元)」不带减号、值是正数。不取反的话支出会被当成收入加进去，
    # 实测营销费用、销售退款、物流运费三项全部符号翻转。
    - {role: outgo, columns: ["支出金额(元)"], negate: true}
    - {role: base_order_id, columns: [主订单id], required: false}
    - {role: sub_order_id, columns: [子订单id], required: false}
    - {role: remark, columns: [备注], required: false}
    - {role: biz_type, columns: [入帐类型], required: false}
    - {role: store_name, columns: [商家昵称], required: false}
    - {role: settle_time, columns: [入帐时间, 发生时间]}
  key_rules:
    - when: {field: base_order_id}
      note: 微信账单直接给主订单id
    - when: {field: remark, extract: '[{(（]\s*(\d{15,25})\s*[})）]'}
      note: 备注里「订单{***}打款」或「基础软件服务费(***)扣款」
  classify_rules:
    # 字典必须排在备注关键词前面。业务描述有值时两边写的是同一套编码
    # （0530288T|技术&服务费-大服饰跨境服务增值费），字典把它收成「跨境增值费」。
    # 原先备注里「淘宝天猫跨境服务增值费」先命中，只写下大类、细项空着，界面退回
    # 显示整段业务描述——支付宝走字典显示「跨境增值费」，微信显示编码全称，
    # 同一笔费对账对不上。业务描述为空的那几千行字典查不到，下面备注规则照收。
    - dictionary: true
      note: 业务描述有值就走字典，和支付宝同一套细项名
    - when: {field: remark, contains: [基础软件服务费, 淘宝天猫跨境服务增值费, 消费券代付资金扣回]}
      major: software_fee
    - when: {field: remark, extract: '^订单.*打款$'}
      major: trade_receipt
    - when:
        field: remark
        contains: [品牌新享-首单拉新计划, 品牌新享新品孵化软件服务费, 限时红包代商家垫付扣回]
      major: marketing_fee
    - when: {field: remark, extract: '^订单.*退款$'}
      major: trade_refund
    - when: {field: biz_type, equals: [交易收款]}
      major: trade_receipt
      note: 实测 3,642 行业务描述和备注都为空，只能靠入帐类型
    - when: {field: biz_type, equals: [交易退款(售后)]}
      major: trade_refund
    - when: {field: biz_type, equals: [扣款, 扣款退回]}
      major: marketing_fee
    - when: {field: biz_type, equals: [提现]}
      exclude: true
      note: 提现是资金搬运，不是损益

- id: taobao_settlement_wechat_v2
  source: settlement
  name: 淘宝对账-微信账单（天猫八列版）
  # 同一个千牛入口能导出两种表头。喜必顺那份 14 列，带商家昵称、主/子订单id 两列、
  # 入「帐」类型；天猫皇莉诗这份 8 列，只有一列「淘宝订单编号」、写的是入「账」类型。
  # 一个字之差和少了六列，v1 的必需列只对上 1/5，连「接近」都报不出来，
  # 界面上只说「没见过这种表头（8 列）」。整条微信渠道因此不进账——本期这家店
  # 微信侧 4,009 笔交易收款、146,132.59 元一分都没算进收入。
  match_columns: [入账时间, 支付流水号, 淘宝订单编号, 入账类型, 业务描述, 备注]
  sign: as_is
  time_slots: {settle_date: settle_time}
  bindings:
    - {role: txn_id, columns: [支付流水号]}
    - {role: subject, columns: [业务描述], required: false}
    - {role: income, columns: ["收入金额（元）", "收入金额(元)"]}
    # 和 v1 同一个坑：支出列写的是正数（实测 7,764 行全正）。不取反就变成收入。
    - {role: outgo, columns: [支出金额, "支出金额(元)"], negate: true}
    - {role: base_order_id, columns: [淘宝订单编号], required: false}
    - {role: remark, columns: [备注], required: false}
    - {role: biz_type, columns: [入账类型], required: false}
    - {role: settle_time, columns: [入账时间]}
  key_rules:
    - when: {field: base_order_id}
      note: >
        淘宝订单编号就是主订单号：全表 11,795 行里有 11,705 行和备注括号里的
        订单号完全一致。剩下 85 行是退款和扣款退回，两处指向一对主/子订单，
        以列为准和 v1 保持同一口径。
    - when: {field: remark, extract: '[{(（]\s*(\d{15,25})\s*[})）]'}
      note: 列为空的 4 行走备注
  classify_rules:
    # 这张表 6,251 行业务描述是空的，费项只能从备注和入账类型里读——那些行字典
    # 查不到，会落到下面的备注规则。业务描述有值的行必须先走字典：支付宝同一套
    # 编码（0530288T|…跨境服务增值费）字典收成「跨境增值费」，微信原先被备注
    # 「淘宝天猫跨境服务增值费」抢走，细项空着，界面上就出现两个费项名。
    - dictionary: true
      note: 业务描述有值就走字典，和支付宝同一套细项名
    - when:
        field: remark
        contains: [基础软件服务费, 淘宝天猫跨境服务增值费, 消费券代付资金扣回, 先用后付技术服务费]
      major: software_fee
    - when: {field: remark, extract: '^订单.*打款$'}
      major: trade_receipt
    # 品牌新享底下有四种叫法（首单拉新 1,909、新品孵化 191、超级老客 77、
    # 加上 18 行扣款退回），按前缀一条盖住，字典里这四条也都是营销费用。
    - when: {field: remark, contains: [品牌新享, 限时红包代商家垫付扣回]}
      major: marketing_fee
    - when: {field: remark, extract: '^订单.*退款$'}
      major: trade_refund
    - when: {field: biz_type, equals: [交易收款]}
      major: trade_receipt
    - when: {field: biz_type, equals: ["交易退款(售后)"]}
      major: trade_refund
    - when: {field: biz_type, equals: [保证金扣款]}
      major: trade_compensation
      note: 备注写「保证金管控资金使用」，和字典里「交易赔付（保证金扣款）」同一件事
    - when: {field: biz_type, equals: [提现]}
      major: withdrawal
      minor: 提现
      note: >
        提现只有 4 行，但是 -195,711.65 元，比这家店整月利润还大。归成提现口径
        进得来不进利润，在「没算进利润的钱」里看得见。v1 那条写的是显式排除，
        排掉之后这笔钱在界面上一处都找不到，人没法核对提现和银行流水对不对上。

        细项要自己写上。这张表的业务描述整列是空的，字典无从查起，不写细项的话
        「没进利润的钱」那张表上这一行的名字会是 withdrawal——一个用户自己表里
        根本不存在的词。

# ======================================================================== #
# 成本各源
# ======================================================================== #
- id: jushuitan_cost_v1
  source: order_cost
  name: 聚水潭订单成本
  # 不要求「总成本」那一列。它是人手加的公式列（总成本=成本价*数量），算账根本不读它——
  # goods_cost 自己拿成本价乘数量。可它写在必需列里的后果非常重：天猫皇莉诗那份
  # 聚水潭导出没有这一列（146,738 行），于是这张模板匹配不上，表头相同的
  # 「补发订单成本」接了过去，结果是商品成本整项为空、毛利和利润都算不出来，
  # 而界面上这张表显示「认出来了」。
  match_columns: [内部订单号, 线上订单号, 线上子订单编号, 原始线上订单号, 成本价]
  parse: {header_row: 1}
  time_slots: {order_date: order_time}
  bindings:
    - {role: internal_order_id, columns: [内部订单号]}
    - {role: order_id, columns: [线上订单号]}
    - {role: sub_order_id, columns: [线上子订单编号]}
    - {role: original_order_id, columns: [原始线上订单号]}
    - {role: tracking_no, columns: [快递单号], required: false}
    - {role: order_type, columns: [订单类型], required: false}
    - {role: order_state, columns: [状态], required: false}
    - {role: store_name, columns: [店铺名称], required: false}
    - {role: sku, columns: [商品编码]}
    - {role: quantity, columns: [数量]}
    - {role: unit_cost, columns: [成本价]}
    - {role: total_cost, columns: [总成本], required: false}
    - {role: order_time, columns: [下单时间]}
  note: >
    列名必须是「线上子订单编号」，写成「线上子订单号」会让覆盖率归零。

    淘宝店有 388 行拿不到成本价：385 行是空的（补差价商品，以及被合并、被拆分
    之后成本落到另一张单子上的行），另外 3 行把商品编码填进了成本价那一格
    （HZS00888、HSC25016、HSC25021），归一化时当空处理并留痕。

    状态那一列的取值各店不一样：天猫皇莉诗那份写「取消」，另外四家写「已取消」。
    排除取消订单的条件因此要两个词都认，见 metrics.yaml 里 goods_cost 那一条。

    线上子订单编号可以是空的，这种行挂不到脊柱，成本不进账。六家店都有，形状完全
    一致：空号行 100% 是商品单价为 0 的赠品行（数字气球、定制海报这类随单送的实物）。
    2026-06 共 3,291.39 元，96% 在天猫皇莉诗那一家（370 行、3,159.44 元，占该店全表
    成本 0.66%）；另外五家 1.53～87.67 元，都在 0.25% 以下。2026-05 三家店共 293.62 元。

    人工表也不算这些行。它的聚水潭成本列是按子订单编号 SUMIFS 取数，和引擎用同一个
    键，空号一样取不到——实测淘宝喜必顺 22 个受影响子订单，人工表的金额 22 个全部
    等于「不含空号行」的数，没有一个等于含的。所以引擎和现行账是对上的。

    但这笔钱是真花掉的：186 个赠品商品编码里 151 个在别的订单里正常卖过（单价 > 0），
    634 行中 484 行的成本价与它正常卖出时的成本价一分不差——有真实进价的实物 SKU，
    随单送出去就是真花了钱。业务 2026-08 确认先维持现状不计入。在此之前它们在
    「取不出订单号，要查归属」那一桶里看得见，没有悄悄进利润，也没有悄悄消失。

    试过按角色兜底（子订单号为空时用主订单号补，且只在补出来的号本身就是脊柱上的
    一个子订单时才采用），已撤回。它收回天猫 2,646.67 元，方向是让引擎离人工表更远。
    要重新捡起来的话，两件事别再走一遍弯路：
      · 判断依据必须逐子订单和人工表比，不能看总差。引擎的商品成本本来就比人工表
        偏小，往里加任何一笔都会让总差变小，那个「变小」和这些行算得对不对无关。
      · 主订单只有一个子订单时补号是精确的（脊柱里 19,525 个单子订单主订单，
        19,525 个的子订单号都等于主订单号，无一例外）；天猫 2026-06 这样能收回
        2,646.67 元，剩下 190 行、512.77 元的主订单有好几个子订单，归哪一个不知道，
        均分会让某个商品的成本凭空多一点、另一个少一点，而两边都不报错。

    状态是被拆分或被合并的空号行要单独看一眼，怕的是成本记两遍。实测这份表 207 行
    里，80 行（119.06 元）的商品编码与同单某个有号行相同，那才有可能是副本；另外
    127 行（665.82 元）是不同商品，是同一单上另外送出去的东西。207 行的内部子订单
    编号在本单内都唯一。分不出来的那 80 行要业务看单据，导出本身说不清。

    这份表可能交不止一份，第二份业务叫 K 表（「聚水潭成本（补充）-店名.xlsx」），
    结构和这张完全一样，所以走同一个模板。别指望它来填上面那 388 行：2026-08 这批
    真表里，五家店的 K 表补上的空成本价是 0 行。它是同一段时间的第二次导出，比第一次
    全，两份合并才是完整成本。合并不会重复计算，去重键和它为什么不含成本价，
    见 sources.yaml。

    K 表里混着别家店的行。抖音那份 28,992 行里有 28,972 行是淘宝店的（店铺名称写着
    汪学成-天猫喜必顺旗舰店），京东那份 33,194 行里也有 28,972 行是淘宝的——
    店长导表时把别人的那份一起粘进来了。钱不会因此记错店：商品成本按线上子订单编号
    挂到脊柱，挂不上这家店的订单就不进这家店的账。但界面上这一项的孤儿金额会很难看
    （抖音 9,528 个键、15.5 万元），那不是账错了，是这份表交错了。

    总成本那一列不参与算账。表头批注写着「公式：总成本=成本价*数量」，指标就照这个
    式子自己乘，实测 70,954 行两者一分不差。这样 K 表就算没带总成本列也能算。

- id: promotion_taobao_v1
  source: promotion
  name: 淘宝推广商品报表
  match_columns: [日期, 主体ID, 主体类型, 花费, 展现量, 点击量]
  parse: {header_row: 1}
  time_slots: {spend_date: spend_time}
  bindings:
    - {role: product_id, columns: [主体ID]}
    - {role: subject_type, columns: [主体类型], required: false}
    - {role: product_name, columns: [主体名称], required: false}
    - {role: spend, columns: [花费]}
    - {role: spend_time, columns: [日期]}
  note: 商品级，没有订单号。按商品ID 均分到该商品的订单行。

- id: promotion_douyin_v1
  source: promotion
  name: 抖音推广报表
  match_columns: [商品ID, 整体消耗]
  parse: {header_row: 1}
  bindings:
    - {role: product_id, columns: [商品ID]}
    - {role: spend, columns: [整体消耗]}
    - {role: spend_time, columns: [日期], required: false}
  time_slots: {spend_date: spend_time}

- id: promotion_jd_v1
  source: promotion
  name: 京东推广（京准通自定义报表）
  match_columns: [跟单SKU ID, 跟单SKU名称, 花费, 展现数, 点击数]
  parse: {header_row: 1}
  bindings:
    - {role: product_id, columns: [跟单SKU ID]}
    - {role: product_name, columns: [跟单SKU名称], required: false}
    - {role: spend, columns: [花费]}
    - {role: spend_period, columns: [日期], required: false}
  note: >
    按跟单 SKU ID 匹配订单明细的商品ID，与淘宝按主体ID、拼多多按商品ID 是同一件事。

    日期那一列不是日期，是「20260501~20260531」这样一个区间字符串，整张表 2,261 行
    全是同一个值——这个报表是按所选时间段汇总的，本来就没有日次。所以它绑成一个
    普通文本角色，不进时间槽位：账期跟着它挂上的订单走。硬当日期解会得到一整列空值
    加一整列解析失败的告警，而告警是有代价的——一旦有人习惯了忽略它，
    真正解析失败的那天也不会有人看。

- id: promotion_pdd_v1
  source: promotion
  name: 拼多多推广（推广平台-报表下载）
  match_columns: [商品ID, 商品名称, 推广场景, "总花费(元)", 曝光量, 点击量]
  parse: {header_row: 1}
  total_row_marker: spend_time
  time_slots: {spend_date: spend_time}
  bindings:
    - {role: product_id, columns: [商品ID]}
    - {role: product_name, columns: [商品名称], required: false}
    # 成交花费只算直接成交的那部分，总花费是这个商品这一天真正花掉的钱。
    - {role: spend, columns: ["总花费(元)"]}
    - {role: spend_time, columns: [日期]}
  note: >
    一行一个商品一天。表底有一行总计（日期那格写着「总计」，靠 total_row_marker
    丢掉）——不丢的话推广费正好翻倍，店铺那张手工表就是这么翻的：
    实测商品行合计 1,871.01，含总计行一起加是 3,742.02，而他们订单明细里
    推广费用那一列的合计恰好是 3,742.02。

    规则表里的「全店推广」那一步没有照做。它写的是把（总计 − 各商品之和）按商品数
    均摊，本意是分掉全店托管那部分没有商品明细的花费——表底的注释也写着
    「合计数据包含全店托管，但全店托管不提供单个商品的花费」。本期这个差额是 0，
    他们算出来的每商品 374.20 元全店推广，来源是把总计行自己也加进了「各商品之和」，
    是上面那个翻倍的副产品，不是真的全店托管花费。

    差额真的不为零的时候，丢合计行那一步会把它作为一条观察记下来（「合计行的 spend
    说 X，明细行加起来 Y」），有人看得见再决定怎么摊。眼下先不摊：摊法只有规则表
    那一句话，没有一行数据能验证它摊得对不对，而摊错了不会报错，只会让每个商品的
    利润都偏一点。

- id: brushing_v1
  source: brushing
  name: 刷单本金佣金
  # 不要求总金额那一列：淘宝那份叫总金额，拼多多那份叫合计，同一个东西两种叫法。
  # 写进必需列会让拼多多那份认不出来。
  match_columns: [下单日期, 付款日期, 店铺, 订单号, 本金, 佣金]
  parse: {header_row: 1}
  time_slots: {order_date: order_time}
  bindings:
    - {role: order_id, columns: [订单号]}
    - {role: store_name, columns: [店铺]}
    - {role: principal, columns: [本金]}
    - {role: commission, columns: [佣金]}
    - {role: platform_fee, columns: [平台费], required: false}
    - {role: total_cost, columns: [总金额, 合计], required: false}
    - {role: order_time, columns: [下单日期]}
  note: >
    全公司一张表，必须按店铺筛，否则会把别的店的刷单算进来。

    金额自己按本金+佣金加，不读现成的总金额/合计列。两个平台的规则表都写着
    总金额=本金+佣金，实测也一分不差，所以那一列没有信息量，只有风险：
    天猫皇莉诗那份刷单表没有它，而它原先是必需绑定，整张表因此解析失败，
    本金佣金恒为 0——而界面上只说「认不出来的表」，不会说少算了哪一项。

- id: dropship_v1
  source: dropship
  name: 代发采购成本
  match_columns: [下单日期, 店铺, 订单号, 订单金额, 代购成本]
  parse: {header_row: 1}
  time_slots: {order_date: order_time}
  bindings:
    - {role: order_id, columns: [订单号]}
    - {role: store_name, columns: [店铺]}
    - {role: total_cost, columns: [代购成本]}
    - {role: order_time, columns: [下单日期]}
    - {role: owner, columns: [负责人], required: false}

- id: reshipment_v1
  source: reshipment
  name: 补发订单成本
  match_columns: [内部订单号, 原始线上订单号, 订单类型, 成本价, 商品编码]
  parse: {header_row: 1}
  time_slots: {order_date: order_time}
  bindings:
    - {role: original_order_id, columns: [原始线上订单号]}
    - {role: sub_order_id, columns: [线上子订单编号], required: false}
    - {role: sku, columns: [商品编码]}
    - {role: quantity, columns: [数量]}
    - {role: unit_cost, columns: [成本价]}
    - {role: order_time, columns: [下单时间]}
    - {role: store_name, columns: [店铺名称], required: false}
  note: >
    这张表是聚水潭成本表按「订单类型=补发订单」筛出来粘贴的副本，结构完全相同，
    没有任何一列能把两者区分开——原先靠「没有总成本列」来区分是错的，它有这一列，
    这条排除规则反而把正确模板自己踢掉了，导致补发成本长期算成 0。

    现在靠数据源上的文件名线索（补发）路由。认出来只是为了不报「无法识别」，
    没有任何口径消费这个来源：补发成本从聚水潭表按订单类型直接拆，
    见 metrics.yaml 的 reshipment_cost。摄了这张表也不会重复计算。

- id: freight_v1
  source: freight
  name: 运费结算
  # 只认三个店都有的列。物料结算名称只有淘宝那份叫这个名字，
  # 1688 和抖音叫「账单结算对象名称」，写进必需列会让那两份认不出来。
  match_columns: [扫描时间, 运单号码, 总金额]
  parse: {header_row: 1}
  time_slots: {ship_date: scan_time}
  bindings:
    - {role: tracking_no, columns: [运单号码]}
    # 同一个东西的两种叫法：都是承运方结算主体。
    - {role: material_name, columns: [物料结算名称, 账单结算对象名称], required: false}
    - {role: total_cost, columns: [总金额]}
    - {role: scan_time, columns: [扫描时间]}
    # 抖音那份运费表带这两列，淘宝和 1688 那两份没有。业务的算法是两处回查各出一列
    # 再合并：子订单来自订单明细的快递单号，子订单2 来自聚水潭的物流单号。
    - {role: sub_order_id, columns: [子订单], required: false}
    - {role: sub_order_id_alt, columns: [子订单2], required: false}
  key_rules:
    # 两条自带子订单号的规则都要求「至少有一个非零数字」。这一列是 xlookup 的结果，
    # 查不到时公式返回的是 0，而 0 不是空——29.9 万行里 29.9 万行都写着 0.0。
    # 不加这个条件的话第一条规则对每一行都命中，取到的键是「0.0」，既挂不上订单
    # 也不会再往下试回查，等于后面三条规则形同虚设。
    - when: {field: sub_order_id, matches: '[1-9]'}
      note: >
        运费表自带子订单号时直接用，不必回查。只有抖音那份有这一列，
        而抖音的口径正是按它匹配：发货运费=sumifs(运费表总金额, 运费表子订单, 子订单编号)。
        必须排在回查前面：回查拿到的是主订单号，用它去匹配子订单会挂错。
    - when: {field: sub_order_id_alt, matches: '[1-9]'}
      note: >
        子订单那一列查不到时用子订单2。业务的原话是「如果子订单2有值、子订单为 0，
        就补充到子订单列」，也就是这一条兜底。本期只补回 2 行 3.25 元，但少的是
        3.25 还是 3,250 取决于哪个月，规则不该按金额大小决定要不要实现。
    - when: {field: tracking_no}
      via: {source: order_detail, match: tracking_no, take: order_id}
      note: 没有子订单号就拿运单号去订单明细查物流单号，得到主订单编号
    - when: {field: tracking_no}
      via: {source: order_cost, match: tracking_no, take: original_order_id}
      note: >
        查不到再去聚水潭查快递单号，得到原始线上订单号。
        京东只有这一级能成：它的订单明细压根没有运单号列，所以上一条永远查不到，
        业务给京东写的规则也正是「订单号=xlookup(运单号码, 聚水潭物流单号, 原始线上订单号)」。
  note: >
    实测这张表 29.9 万行里九成五两级都回查不到，因为它是全公司所有店铺的运单
    混在一起，单店只能认领属于自己的那部分。回查不到的不是错误，但要计量。

- id: small_payment_v1
  source: small_payment
  name: 小额打款
  match_columns: [网店名称, 收款人姓名, 付款金额, 报销人, 摘要, 订单号]
  parse: {header_row: 1}
  time_slots: {order_date: order_time}
  bindings:
    - {role: serial_no, columns: [序号]}
    - {role: order_id, columns: [订单号]}
    - {role: store_name, columns: [网店名称]}
    - {role: total_cost, columns: [付款金额]}
    - {role: remark, columns: [摘要], required: false}
    - {role: order_time, columns: [下单日期]}
    - {role: owner, columns: [报销人], required: false}
  note: 全公司一张表，跨越多年多店，必须按网店名称筛。

- id: insurance_douyin_v1
  source: insurance
  name: 抖店保费支出（聚合账户）
  match_columns: [保险单号, 动账流水号, 关联子订单号, 摘要描述, "金额(元)"]
  parse: {header_row: 0}
  time_slots: {settle_date: settle_time}
  bindings:
    - {role: txn_id, columns: [动账流水号]}
    - {role: sub_order_id, columns: [关联子订单号]}
    - {role: total_cost, columns: ["金额(元)"]}
    - {role: remark, columns: [摘要描述], required: false}
    - {role: settle_time, columns: [动账时间]}
  note: >
    表头在第一行，没有说明行——和抖音其他几张表不一样，别顺手写成 header_row: 1。
    本期整张表只有表头。

# --------------------------------------------------------------------------- #
# 1688 与抖音的对账表。三家店的对账表结构完全不同，各建各的模板。
# --------------------------------------------------------------------------- #

- id: alibaba1688_settlement_in_v1
  source: settlement
  name: 1688 收款明细
  match_columns: [账单编号, 应收金额(元), 已收金额(元), 账单类型, 场景类型, 关联订单号]
  parse: {header_row: 1}
  time_slots: {settle_date: settle_time}
  bindings:
    - {role: txn_id, columns: [账单编号]}
    - {role: base_order_id, columns: [关联订单号], occurrence: 0}
    - {role: income, columns: ["已收金额(元)"]}
    - {role: subject, columns: [场景类型]}
    - {role: minor_subject, columns: [场景明细], required: false}
    - {role: biz_type, columns: [账单类型], required: false}
    - {role: bill_status, columns: [账单状态], required: false}
    - {role: settle_time, columns: [账单创建时间]}
  classify_rules:
    # 订单收入和订单售后退款都归销售收入。退款行的已收金额本身是负数，
    # 落在同一个科目上就是净额，正是 1688 现行口径里「销售收入」那一列的含义。
    - when: {field: subject, contains: [订单收入, 订单售后退款]}
      major: trade_receipt_1688
  note: >
    收款侧只有一个金额列「已收金额(元)」，正数是收进来的钱。
    场景类型只有两个取值：订单收入 2,290 行、订单售后退款 14 行，退款是负数。
    右边第 17、18 列是人工加的关联订单号和求和项，不参与解析。

- id: alibaba1688_settlement_out_v1
  source: settlement
  name: 1688 付款明细
  match_columns: [账单编号, 应付金额(元), 已付金额(元), 账单类型, 场景类型, 关联订单号]
  parse: {header_row: 1}
  time_slots: {settle_date: settle_time}
  bindings:
    - {role: txn_id, columns: [账单编号]}
    - {role: base_order_id, columns: [关联订单号]}
    # 已付金额是正数（2,729 行正、3 行负），和微信支出列同一个坑：
    # 平台把「付出去多少」写成正数，不取反就会被当成收入。
    - {role: outgo, columns: ["已付金额(元)"], negate: true}
    - {role: subject, columns: [场景明细]}
    - {role: biz_type, columns: [账单类型], required: false}
    - {role: settle_time, columns: [账单创建时间]}
  classify_rules:
    - when: {field: subject, notnull: true}
      major: trade_expense_1688
  note: >
    付款侧全部归一条「销售支出」，不拆费项——1688 那张订单明细表的公式就是这么写的：
    销售支出=sumifs(对账表已付金额,关联订单号,订单号)/countifs(订单号)。
    场景明细有服务费、技术服务费缴纳、大分销抽佣、跨境供应链服务、仅退款补贴几种，
    合计只有 667.50 元，拆开对利润没有意义，保持和人工口径一致。

- id: jd_settlement_v1
  source: settlement
  name: 京东对账（财务-对账中心导出）
  match_columns: [订单编号, 父单号, 费用名称, 应结金额, 收支方向, 结算状态]
  parse: {header_row: 1}
  time_slots: {settle_date: settle_time}
  bindings:
    - {role: base_order_id, columns: [订单编号], occurrence: 0}
    - {role: parent_order_id, columns: [父单号], required: false}
    - {role: subject, columns: [费用名称]}
    # 应结金额自带符号：支出为负。实测收入 5,281 行全正、支出 31,630 行全负。
    - {role: income, columns: [应结金额]}
    - {role: direction, columns: [收支方向]}
    - {role: bill_status, columns: [结算状态]}
    - {role: order_state, columns: [订单状态], required: false}
    - {role: txn_id, columns: [结算单号], required: false}
    - {role: remark, columns: [资金动账备注], required: false}
    - {role: settle_time, columns: [到账时间]}
  classify_rules:
    - dictionary: true
      note: >
        查科目字典。本期 15 种费用名称全部命中——售后卖家赔付费和返利框架费
        原先没有条目，按京东规则表「值填充为平台技术服务费」补进字典了，
        写在字典里而不是写成一条模板规则，是因为它就是一条科目名到大类的映射。
  reclassify:
    - when_major: trade_receipt
      and_when: {field: direction, equals: [支出]}
      major: trade_refund
      note: >
        京东规则表第二步：费项为交易收款、收支方向为支出的，改判成交易退款。
        实测命中 257 行、-6,173.83 元——货款退回 256 行，代收配送费退回 1 行。
        不改判的话这笔钱会当成负的销售收入混进收入行，收入和退款两行都不对。
  note: >
    右边第 34-38 列是人工加的透视表（订单编号、交易收款、平台技术服务费、交易退款、
    总计），不参与解析——而且它是错的：实测那张透视表的每一项都正好是原始行的两倍
    （交易收款 213,416.10 对 106,708.05，技术服务费 -34,141.42 对 -17,070.71，
    交易退款 -12,347.66 对 -6,173.83，总计 166,927.02 对 83,463.51）。
    店铺那张订单明细的 SUMIFS 引的就是这张透视表，所以他们手工算出来的利润
    每一项都翻了一倍，见 checks.yaml 里的对照。

    只有已结算的算数（规则表写的「未结算和不结算的删掉」）。本期导出里 36,911 行
    全是已结算，筛选写在指标的 where 上而不是这里，这样漏进来的行会显示成
    未归类而不是无声消失。

- id: pdd_settlement_v1
  source: settlement
  name: 拼多多对账（账户资金-对账中心导出）
  match_columns: [商户订单号, 发生时间, 收入金额（+元）, 支出金额（-元）, 账务类型, 业务描述]
  exclude_columns: [账务流水号]
  parse: {header_row: 1}
  sign: as_is
  time_slots: {settle_date: settle_time}
  bindings:
    - {role: base_order_id, columns: [商户订单号], occurrence: 0}
    - {role: subject, columns: [业务描述]}
    - {role: income, columns: ["收入金额（+元）"]}
    - {role: outgo, columns: ["支出金额（-元）"]}
    - {role: biz_type, columns: [账务类型], required: false}
    - {role: remark, columns: [备注], required: false}
    - {role: settle_time, columns: [发生时间]}
  classify_rules:
    - dictionary: true
      note: >
        业务描述是「0010002|交易收入-订单收入」这种带编号的全称，字典里存的就是全称，
        直接查得到。本期 16 种全部命中——合作费追回原先没有条目，比照同一组的
        申诉追回归到交易赔付。
  note: >
    列名和淘宝支付宝账务明细撞了一半（收入金额、支出金额、商户订单号、业务描述），
    靠 exclude_columns 里的账务流水号分开：淘宝那张有，这张没有。

    右边第 12-19 列是人工加的透视表，不参与解析，而且和京东那张一样每项正好翻倍
    （交易收款 214,087.12 对 107,043.56，交易退款 -43,690.92 对 -21,845.46，
    提现 -175,200 对 -87,600）。

    提现和转账-广告账户不是经营损益：字典把它们归到 withdrawal 和 ad_topup，
    没有任何指标消费这两个口径项，所以它们进得来但不进利润。本期这两项
    合计 -99,600 元，占对账表流水的大头，混进去的话利润会变成负十万。

- id: douyin_settlement_v1
  source: settlement
  name: 抖音对账单
  match_columns: [动账时间, 动帐流水号, 动账方向, 动账金额, 动账场景, 子订单号]
  parse: {header_row: 1}
  time_slots: {settle_date: settle_time}
  bindings:
    - {role: txn_id, columns: [动帐流水号]}
    - {role: sub_order_id, columns: [子订单号], occurrence: 0}
    - {role: base_order_id, columns: [订单号], required: false}
    # 动账金额自带符号：入账 379 行为正、出账 1,403 行为负，不需要取反。
    - {role: income, columns: [动账金额]}
    - {role: subject, columns: [动账场景]}
    - {role: direction, columns: [动账方向], required: false}
    - {role: charge_type, columns: [计费类型], required: false}
    - {role: settle_time, columns: [动账时间]}
  note: >
    费项走字典，不再用一条「凡是有动账场景就算净额」的规则盖过去。业务这次把抖音的
    费项分类对照表一起给了（附在对账文件的 Sheet1，20 条），和字典里已有的 20 条
    逐条相同。

    货款直投千川那 1,399 行出账（本期 -2,640.09）是把货款直接划进广告账户，
    对照表里没有这一条，字典按和万相台一样的口径归成广告充值、不计入利润：
    充值是钱换了个口袋，真正花掉多少看推广表的整体消耗（本期 529.95）。
    两个数差着五倍，说明它们不是同一笔钱的两种说法——把充值当消耗会让推广费虚高。

    商户主体名称这一列不再绑成店名。它写的是「义乌星泽天成供应链管理有限公司」，
    一个主体名——1688 星泽那家店也是同一个。绑成店名的后果是挂不上订单的 1,606 行
    落进一个不存在的店期，而切片按 (店, 账期) 取，于是这批行既不进损益表也不进
    未归属清单，界面上一处都看不见（其中 191 行、3,180.46 元是销售收入，
    比这家店报出来的收入还多）。引擎那侧也补了防线，见 calculate._own_store。

    主体本身照旧配在 stores.yaml 里。1688 的收款明细同样有这么一列，也没绑——
    读到的主体名和配的核对是另一件事，不该走店名这条路。

    右边第 42、43 列是人工加的子订单号和求和项，不参与解析。
