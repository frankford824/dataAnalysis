# 店铺注册表。
#
# 店铺是数据归属和账期结算的单位。交上来的文件靠文件名认店：文件名形如
# 「聚水潭成本-淘宝喜必顺.xlsx」，破折号后面就是这里的 name。
#
# 店铺和法人主体是多对一。下面 1688星泽气球派对 和 抖音浅花涧节日装饰 就同属
# 义乌星泽天成供应链管理有限公司——这层关系推不出来，只能配。
#
# 主体名不是谁凭印象填的，是从交上来的数据里读出来的：1688 收款明细有「归属主体名称」
# 和「归属主体税号」，抖音对账单有「商户主体名称」，两处写的都是同一家。淘宝那份
# 读不到，支付宝和微信账单不带主体信息——这种只能由人配，引擎不猜。
#
# 这个文件不用手编。改配置走界面的店铺设置，或者命令行：
#
#     ledger stores                                     看全部店铺和主体
#     ledger store set <id> --entity 主体全名 --tax-id …  配主体
#     ledger store set <id> --alias 旧店名                改过名的店再认一个别名
#     ledger store set <id> --archive                    关店归档，历史账仍可重算
#     ledger store add <id> <店名> --platform taobao      开新店
#
# 写回会保住这些注释，写完立刻校验，校验不过就回滚——绝不留下一个加载不了的模型。
# id 和 name 不让改：id 是关联键，name 是认文件的依据，改了历史账就对不上；
# 店铺改名请加别名，把旧名留着。
#
# 只登记了目前有数据的三家。BI 逆向出的 45 个报表里还有几十家店（PDD 十几家、
# 京东、抖店、另外几家 1688 和淘宝），要纳入就用上面的 add 命令加。

- id: taobao_xibishun
  name: 淘宝喜必顺
  platform: taobao
  entity: ""
  note: >-
    主体待配。支付宝和微信账单都不带主体信息，引擎读不出来，也不该猜。在界面的店铺设置里填，或者 ledger store set taobao_xibishun --entity 主体全名。

- id: alibaba1688_xingze
  name: 1688星泽气球派对
  platform: alibaba1688
  entity: 义乌星泽天成供应链管理有限公司
  entity_tax_id: "91330782MACX8XB45T"
  note: 主体取自 1688 收款明细的「归属主体名称」「归属主体税号」，2,304 行取值唯一。

- id: douyin_qianhuajian
  name: 抖音浅花涧节日装饰
  platform: douyin
  entity: 义乌星泽天成供应链管理有限公司
  note: >
    主体取自抖音对账单的「商户主体名称」，1,782 行取值唯一，
    和 1688星泽气球派对 是同一家主体。
