# 损益表结构。
#
# 主界面只出 level 1 的 5 组，点开才是 level 2 的 13 项。复杂度藏在引擎里，
# 界面上只让人看见他能做决定的那几个数。
#
# 因为所有指标产出的都是「对利润的贡献」（负数即减利润），这里全部是加法，
# 不需要在损益表上再声明哪一项该加哪一项该减。

# ------------------------------------------------------------- level 2 --- #
#
# 一个科目行可以由多个平台的指标喂。各平台口径不同——淘宝把对账表拆成七个费项、
# 1688 只有收支两条、抖音只有一条净额——但对外呈现必须是同一张表，
# 不能让看报表的人先搞清楚这是哪个平台才知道该看哪几行。
# 指标带平台限定，同一时刻只有一个平台的指标在出数，加起来不会串账。
# headline 标记这一项上总览页的哪个位置。营收按销售收入算（不扣退款），
# 和下面利润率的分母保持同一个口径——两处不一致的话，同一张页面上会出现
# 「营收 100 万、利润率按 80 万算」这种没法解释的组合。
- {id: n_receipt, name: 销售收入, level: 2, headline: revenue,
   formula: {op: add, of: [trade_receipt, trade_receipt_1688, trade_net_douyin,
                           trade_receipt_jd, trade_receipt_pdd]}}
- {id: n_refund, name: 销售退款, level: 2,
   formula: {op: add, of: [trade_refund, trade_refund_jd, trade_refund_pdd]}}
- {id: n_expense, name: 平台综合支出, level: 2, formula: {op: add, of: [trade_expense_1688]}}
- {id: n_software, name: 平台服务费, level: 2,
   formula: {op: add, of: [software_fee, software_fee_jd, software_fee_pdd]}}
# 这里原先有一行 n_logistics「平台物流费」，删掉了。理由见 metrics.yaml 里
# logistics_fee 那一段：费项分类对照表五个平台加起来没有「物流运费」这个业务大类，
# 唯一撑着它的集运货值赔付已经被业务改判成交易赔付，这一行没有来源了。
#
# 不留成一个恒为 0 的常量行，是因为这套东西的三条底线都不允许：指标不能指向
# 没人产出的口径项、每个明细行都要点得开、报表行按平台适用性显隐。常量行
# 三条全破——它会在 1688 和抖音的损益表上也冒出来，那两个平台根本没有这个概念。
# 将来真有来源接进来，把指标和这一行一起加回去。
- {id: n_compensation, name: 交易赔付, level: 2,
   formula: {op: add, of: [trade_compensation, trade_compensation_pdd]}}
- {id: n_marketing, name: 平台营销费用, level: 2, formula: {op: add, of: [marketing_fee]}}
- {id: n_goods, name: 商品成本, level: 2, formula: {op: add, of: [goods_cost]}}
- {id: n_dropship, name: 代发成本, level: 2, formula: {op: add, of: [dropship_cost]}}
- {id: n_reshipment, name: 补发成本, level: 2, formula: {op: add, of: [reshipment_cost]}}
- {id: n_freight, name: 发货运费, level: 2, formula: {op: add, of: [freight_cost]}}
- {id: n_ad, name: 推广费用, level: 2, formula: {op: add, of: [ad_cost]}}
- {id: n_small_payment, name: 客服打款, level: 2, formula: {op: add, of: [small_payment_cost]}}
- {id: n_brushing, name: 本金佣金, level: 2, formula: {op: add, of: [brushing_cost]}}

# ------------------------------------------------------------- level 1 --- #
- id: g_revenue
  name: 收入
  level: 1
  children: [n_receipt, n_refund]

- id: g_platform
  name: 平台费用
  level: 1
  children: [n_software, n_compensation, n_marketing, n_expense]
  note: >
    平台从货款里扣走的钱。这一组全是负数。
    淘宝拆成三项，1688 不拆、全部落在「平台综合支出」——它自己的订单明细表就只有
    「销售支出」一列。抖音一项都没有：它的动账金额本身就是扣完各项费用后的净额。

- id: g_goods
  name: 商品成本
  level: 1
  children: [n_goods, n_dropship, n_reshipment]

- id: g_fulfillment
  name: 履约成本
  level: 1
  children: [n_freight]

- id: g_promotion
  name: 营销投入
  level: 1
  children: [n_ad, n_small_payment, n_brushing]
  note: 店铺自己花出去的钱，与平台扣的营销费用分开看。

# --------------------------------------------------------------- 结果 --- #
- id: gross_profit
  name: 毛利
  level: 1
  is_total: true
  commission_base: true
  formula: {op: add, of: [n_receipt, g_goods]}
  note: >
    照现行口径：销售收入减商品成本，不含销售退款。
    三个平台这条公式一致，21,989 / 3,086 / 255 行逐行验证残差为 0。

    可以拿来当提成基数（commission_base）。标在这里而不是写死在提成代码里，
    是为了让两个数永远同源：哪天毛利口径改了，提成基数跟着改，不会出现
    「损益表上的毛利」和「算提成用的毛利」是两个数这种事。

- id: net_profit
  name: 利润
  level: 1
  is_total: true
  headline: profit
  commission_base: true
  formula: {op: add, of: [g_revenue, g_platform, g_goods, g_fulfillment, g_promotion]}
  note: >
    也可以拿来当提成基数，而且这是三家店现在实际用的那个。

    依据是他们自己的订单明细表——那些表里本来就带着人工算好的提成列。反推下来
    提成恰好等于这一行乘一个固定比例，精确到最大值最小值完全相同：
    淘宝汪学成 3.5%（18,549 行）、李秋雨 1.5%，1688 姜惠卉 5%（2,541 行），
    抖音蔡果 5%（175 行里 174 行）。同样这些行按毛利去除，得到的是 0.005 到 0.10
    的一片噪声。也就是说历史上发出去的钱是按利润算的。

    毛利那一行也留着标记，因为口径是逐店配的（Store.commission_base）——
    公司口径未必永远统一，而不统一的时候唯一比「配一下」更糟的选择是「手改数」。

- id: net_margin
  name: 利润率
  level: 1
  display: percent
  headline: margin
  formula: {op: ratio, of: [net_profit, n_receipt]}
