# 指标：一笔钱从哪张表来、怎么取值、挂到哪个订单、怎么分摊、算不算收入。
#
# 全部照实测口径写。三个平台原来各有一套算法（淘宝 13 项、1688 9 项、抖音 8 项），
# 这里统一成一套 13 项，平台差异靠"某项没有数据源"体现，而不是靠不同的公式。
#
# 符号约定：所有指标产出的金额都是「对利润的贡献」，负数就是减利润。
# 这样利润就是全部指标相加，不需要在损益表里再记哪一项该加哪一项该减。
# 这一点是从数据里反解出来的：同一张淘宝订单明细表里，退款/服务费/赔付/营销费用
# 存的是负数要加，物流运费存的是正数要减，两种约定并存。符号只能绑模板，不能猜。
#
# occasional 标记哪些科目不报覆盖率。只有三项报：销售收入、商品成本、发货运费——
# 每个（在 expect 范围内的）订单都该有它们，少了就是真缺数据。其余科目本来就只落在
# 少数订单上：交易赔付一个月十几笔、客服打款几十笔，拿「多少订单有这项」当完整度
# 指标，结果永远是个位数百分比，界面上一整列恒定为红。一旦某一列颜色不再变化，
# 人就不看它了，真正的缺数据信号也跟着一起没人看见。

# ---------------------------------------------------------------- 收入 --- #
- id: trade_receipt
  name: 销售收入
  source: settlement
  platform: taobao
  major: trade_receipt
  value: {op: sum, of: [income, outgo]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: ratio, by: alloc_ratio}
  expect:
    - {field: pay_time, op: notnull}
    - {field: refund_status, op: not_in, value: [退款成功]}
  expect_label: 已付款且未退款
  note: >
    对账表是主订单级，脊柱是子订单级，所以按收入分配率拆到子订单。
    取值是收入+支出而不是单取收入，因为同一笔业务可能两栏都有数。

    覆盖率只对已付款且未全额退款的订单要求。实测没有收款记录的 2,424 个订单里，
    1,855 个退款成功、552 个连付款时间都没有；而有收款记录的 12,795 个里退款成功的
    只占 1.8%。钱进了又全额退回，账单上就没有净收款这一行，这不是对账表没交全。

- id: trade_refund
  name: 销售退款
  occasional: true
  source: settlement
  platform: taobao
  major: trade_refund
  value: {op: sum, of: [income, outgo]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: ratio, by: alloc_ratio}
  note: 源数据本身是负数，直接用，不取反。

# ------------------------------------------------------------ 平台费用 --- #
- id: software_fee
  name: 平台服务费
  occasional: true
  source: settlement
  platform: taobao
  major: software_fee
  value: {op: sum, of: [income, outgo]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: ratio, by: alloc_ratio}
  note: 含类目软件服务费（原天猫佣金）、基础软件服务费、跨境服务增值费等。源数据为负。

# 这里原先有一个 logistics_fee 指标，从对账表取平台物流费，现在删掉了。
#
# 对账表里根本没有「物流运费」这个业务大类——费项分类对照表淘宝天猫那 81 条里
# 一条都没有。它一直是靠模板里一条手写规则（商家集运物流责任货值赔付 → 物流运费）
# 单独撑着的，业务已经把那条改判成交易赔付，来源就没了。
#
# 报表上那一行也一起删了（statement.yaml 的 n_logistics）。留个空壳指标或者
# 恒为 0 的常量行都不行：模型校验器不允许指标指向没人产出的口径项，那正是
# 「某一列悄悄恒为 0 却没人发现」的防线。
#
# 这不只是引擎口径的问题——费项分类对照表五个平台加起来一条都没有「物流运费」
# 这个业务大类，而且它把商家集运物流服务费、商家集运中转操作费明确定成软件服务费，
# 和引擎现在的做法一致。也就是说业务自己的分类表里就没有平台物流费这回事。
#
# 将来真有来源接进来时，把指标加回这儿、报表行加回 statement.yaml。注意符号：
# 源数据是正数、利润公式里是减号，所以当时用的是 sign: negate。

- id: trade_compensation
  name: 交易赔付
  occasional: true
  source: settlement
  platform: taobao
  major: trade_compensation
  value: {op: sum, of: [income, outgo]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: ratio, by: alloc_ratio}

- id: marketing_fee
  name: 平台营销费用
  occasional: true
  source: settlement
  platform: taobao
  major: marketing_fee
  value: {op: sum, of: [income, outgo]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: ratio, by: alloc_ratio}
  note: >
    主要来自业务描述为空的「交易分账」行，实测 11,462 行。
    只按业务描述查字典会把这一整块丢掉，必须靠归类规则链的业务类型兜底。

# ------------------------------------------------------------ 商品成本 --- #
- id: goods_cost
  name: 商品成本
  source: order_cost
  # 成本价×数量，不是直接读「总成本」那一列。两份平台规则表（淘宝、京东）写的都是
  # 「成本价*数量算出总金额」，而聚水潭导出里那列总成本本来就是这么来的——实测
  # 70,954 行两者一分不差。自己乘一遍的好处是补充导出的那份（业务叫 K 表）
  # 就算没带总成本列也能算，少一个「表导得对不对」的前提。
  value: {op: sum_product, of: [unit_cost, quantity]}
  where:
    - {field: order_type, op: not_in, value: [补发订单]}
    # 取消的单子没有成本。空状态要留下：不知道状态不等于已取消，因为不知道就丢掉
    # 一笔成本，账上只会表现为利润高了一点。
    #
    # 两个词都要认。聚水潭这一列在天猫皇莉诗那份导出里写的是「取消」两个字，
    # 别的四家店写的是「已取消」——而原先这条只认「已取消」，于是天猫那 9,203 行
    # 取消订单的成本 79,999.07 元（落进 2026-06 的是 6,074 行、54,622.45 元）
    # 一直被当成真成本计进去了，利润凭空少这么多。
    #
    # 之前四家店没暴露这个问题，不是因为条件写对了，是因为那四家的店长按导表说明
    # 「注3：对于订单状态已取消的需删除对应行数据」手工删掉了取消行——一条永远
    # 匹配不上的过滤条件，和没有这条过滤是一回事，而它看起来像在把关。
    - {field: order_state, op: not_in, value: [已取消, 取消], include_null: true}
  sign: negate
  time_basis: order_date
  link: {key: sub_order_id, to: order.sub_order_id, grain: order}
  expect:
    - {field: tracking_no, op: notnull}
  expect_label: 已发货
  note: >
    子订单级直接挂，不分摊。聚水潭的线上子订单编号与脊柱的子订单编号一一对应。
    必须排除补发订单：它们在同一张表里，由补发成本单独归集，两边都算会重复记账。

    覆盖率只对已发货的订单要求。没发货就没出库，聚水潭里根本没有这一行——
    三家店缺商品成本的订单里，没运单号的占 80%(淘宝)、94%(1688)、95%(抖音)，
    按全部订单算分母的话，覆盖率永远差十几个点，而缺口是虚的。

  by_platform:
    - platform: alibaba1688
      # 1688 的聚水潭表挂的是主订单号，不是子订单号，而且公式里除了 countifs：
      #   聚水潭成本=sumifs(聚水潭总成本, 原始线上订单号, 订单号)/countifs(订单明细订单号, 订单号)
      link: {key: original_order_id, to: order.order_id, grain: order}
      allocate: {mode: even}
      # 不排除补发订单：1688 的订单明细表在补发成本那一列写着「无需计算，已包含在
      # 聚水潭成本里」，也就是它的商品成本口径本来就含补发。淘宝把补发单独列一行，
      # 所以缺省要排除，否则两边都算会重复。这个店的 132 行补发订单成本 501.59 元，
      # 沿用淘宝的排除就会全部漏掉。
      #
      # 补发那条不要，取消那条要留着——清空整个 where 会把它一起清掉。
      where:
        - {field: order_state, op: not_in, value: [已取消, 取消], include_null: true}

    # 京东和拼多多的聚水潭表都挂原始线上订单号，公式也都除了 countifs，
    # 和 1688 一路。两家的规则表都写着「状态为已取消的数据进行清除」，
    # 这条缺省的 where 正好就是它，所以不用覆盖。
    - platform: jd
      link: {key: original_order_id, to: order.order_id, grain: order}
      allocate: {mode: even}
      # 京东的订单明细没有运单号那一列，缺省那条「已发货才要求有成本」在这个平台
      # 恒不成立，分母会变成全部订单，覆盖率显示 79.9%，而缺的那六百单压根没发货。
      # 换成按订单状态判：出库前被取消的单子在聚水潭里本来就没有行。
      #
      # 数据是这么说的——「(删除)等待出库」617 单里 616 单没有成本，「(删除)暂停」33 单
      # 全部没有，「(删除)等待付款确认」2 单全部没有；而「完成」2,735 单里 2,718 单有，
      # 「(删除)等待确认收货」328 单里 288 单有。也就是说该排除的是没出过库的，
      # 不是带「(删除)」前缀的——那个前缀里混着已经发货的单。
      expect:
        - {field: order_state, op: not_contains, value: 等待出库}
        - {field: order_state, op: not_contains, value: 暂停}
        - {field: order_state, op: not_contains, value: 等待付款确认}
      expect_label: 已出库
    - platform: pdd
      link: {key: original_order_id, to: order.order_id, grain: order}
      allocate: {mode: even}

- id: dropship_cost
  name: 代发成本
  occasional: true
  source: dropship
  value: {op: sum, of: [total_cost]}
  sign: negate
  time_basis: order_date
  link: {key: order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: 主订单级，按该主订单下的子订单数均分。实测与人工表逐行完全一致。

  by_platform:
    # 抖音按主订单号均分到子订单，和淘宝一样；1688 除以 countifs(订单号)，
    # 也是同一个语义。五家其实一致，列在这里是为了让「都一样」这件事也有据可查。
    - {platform: alibaba1688, allocate: {mode: even}}
    - {platform: jd, allocate: {mode: even}}
    - {platform: pdd, allocate: {mode: even}}

- id: reshipment_cost
  name: 补发成本
  occasional: true
  source: order_cost
  # 和商品成本同源同算法，见那一条的说明。
  value: {op: sum_product, of: [unit_cost, quantity]}
  where:
    - {field: order_type, op: in, value: [补发订单]}
    - {field: order_state, op: not_in, value: [已取消, 取消], include_null: true}
  sign: negate
  time_basis: order_date
  link: {key: original_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: >
    补发成本不来自单独的补发表，而是从聚水潭成本表按订单类型拆出来的。
    人工流程是「在聚水潭表里筛出补发订单粘贴成另一张表」，那张表是副本不是新数据：
    实测淘宝店 708 行补发订单在两张表里逐行相同，各摄各的就会重复记 4,071.43 元。
    从同一份来源按订单类型拆，重复计算在结构上就不可能发生，店长也少传一张表。

    分摊方式：人工表说明写的是「不分摊」，但数据反解出来是按子订单数均分——
    不分摊会多算 1,904.87 元，均分能逐行对上。以数据为准。

# ------------------------------------------------------------ 履约成本 --- #
  by_platform:
    # 1688 的订单明细表在补发成本那一列写着「无需计算，已包含在聚水潭成本里」。
    # 它的聚水潭成本没有按订单类型排除补发，所以这里再算一遍就是重复。
    - {platform: alibaba1688, disabled: true}

- id: freight_cost
  name: 发货运费
  source: freight
  value: {op: sum, of: [total_cost]}
  sign: negate
  time_basis: ship_date
  link: {to: order.order_id, key: tracking_no, grain: order, min_hit_rate: 0.0}
  allocate: {mode: ratio, by: alloc_ratio}
  expect:
    - {field: tracking_no, op: notnull}
  expect_label: 已发货
  note: >
    订单号靠运单号两级回查得到，见模板里的取键规则链。
    命中率门槛设为 0：这张表是全公司所有店铺的运单，单店只能认领一部分，
    挂不上的绝大多数属于别的店铺，不是数据质量问题。

    覆盖率只对已发货的订单要求，理由同商品成本：没发货就没有运单，运费表里根本
    没有这一行。按全部订单算的话，淘宝这个月是 12,677/15,219=83.3%，看着像漏了
    两千多单的运费，实际那两千多单压根没发出去。

  by_platform:
    # 1688: 发货运费=sumifs(运费表总金额, 运单号)/countifs(订单明细运单号) → 组内均分
    - {platform: alibaba1688, allocate: {mode: even}}
    # 抖音: 发货运费=sumifs(运费表总金额, 运费表子订单, 子订单编号)，按子订单直接挂、不摊
    - platform: douyin
      link: {key: sub_order_id, to: order.sub_order_id, grain: order, min_hit_rate: 0.0}
      direct: true
    # 京东、拼多多都是 sumifs(运费表总金额, 订单号)/countifs(订单号)，组内均分。
    # 京东的订单明细没有运单号列，回查只能走聚水潭那一级，见模板里的说明。
    - {platform: jd, allocate: {mode: even}}
    - {platform: pdd, allocate: {mode: even}}

# ------------------------------------------------------------ 营销投入 --- #
- id: ad_cost
  name: 推广费用
  occasional: true
  source: promotion
  value: {op: sum, of: [spend]}
  sign: negate
  time_basis: spend_date
  link: {key: product_id, to: order.product_id, grain: product}
  allocate: {mode: even}
  note: 商品级，按该商品的订单行数均分。实测与人工表逐行完全一致。

  by_platform:
    # 1688 那张订单明细表的推广费用列写着「无公式，数值全补成 0」——这个店没有投放数据。
    - {platform: alibaba1688, disabled: true}
    # 京东按跟单 SKU ID、拼多多按商品ID，两家的公式都是除以 countifs(商品ID)，
    # 和缺省的按商品行数均分是同一件事。
    - {platform: jd, allocate: {mode: even}}
    - {platform: pdd, allocate: {mode: even}}

- id: small_payment_cost
  name: 客服打款
  occasional: true
  source: small_payment
  value: {op: sum, of: [total_cost]}
  sign: negate
  time_basis: order_date
  link: {key: order_id, to: order.order_id, grain: order}
  allocate: {mode: ratio, by: alloc_ratio}

  by_platform:
    # 淘宝按收入分配率比例摊，其余四家都是除以 countifs，即组内均分。
    - {platform: alibaba1688, allocate: {mode: even}}
    - {platform: douyin, allocate: {mode: even}}
    - {platform: jd, allocate: {mode: even}}
    # 拼多多这家店本期没有小额打款，它的规则表在这一项旁边写着「目前该店铺无小额打款
    # 故值设为 0」。指标照留：写死成 0 的话，哪天真发生了会一直算成 0。
    - {platform: pdd, allocate: {mode: even}}

- id: brushing_cost
  name: 本金佣金
  occasional: true
  source: brushing
  value: {op: sum, of: [principal, commission]}
  sign: negate
  time_basis: order_date
  link: {key: order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: >
    人工表的说明同样写「不分摊」。本批数据里没有出现"一个刷单订单对应多个子订单"
    的情况，两种算法结果相同，按与代发、补发一致的口径统一为均分。

    金额自己加本金和佣金，不读表上那一列总金额。两者相等是两个平台规则表明写的，
    实测也一分不差；但有的店导出来的刷单表没有总金额列，依赖它就意味着那家店
    这一项静静地算成 0。能从原始列推出来的东西，不要指望人手加的公式列。

# --------------------------------------------------------------- 1688 收支 --- #
# 1688 的口径来自它自己那张订单明细表的公式，和淘宝不是一回事：
#   销售收入=sumifs(对账表已收金额,关联订单号,订单号)/countifs(订单明细订单号,订单号)
#   销售支出=sumifs(对账表已付金额,关联订单号,订单号)/countifs(订单明细订单号,订单号)
# 除以 countifs 就是在同一订单的多行之间均摊，对应 allocate.mode=even。
  by_platform:
    - {platform: douyin, allocate: {mode: even}}

- id: trade_receipt_1688
  name: 销售收入
  source: settlement
  platform: alibaba1688
  major: trade_receipt_1688
  value: {op: sum, of: [income]}
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
- id: trade_expense_1688
  name: 销售支出
  occasional: true
  source: settlement
  platform: alibaba1688
  major: trade_expense_1688
  value: {op: sum, of: [outgo]}
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: >
    保障服务、先采后付、交易技术服务费、赔付补贴全归这一条，不拆费项。
    人工口径就是不拆——1688 的订单明细表里只有「销售支出」一列。

# ----------------------------------------------------------------- 京东 --- #
# 口径来自京东那张订单明细表的公式，每一项都除以 countifs(订单号)，也就是同一订单的
# 多行之间均摊。它的对账表只拆三项：交易收款、交易退款、平台技术服务费。
#
# 大类沿用淘宝那几个（trade_receipt / trade_refund / software_fee）。同名不串账：
# 指标带平台限定，事实行先按 metric_id 认领再比大类，两个平台的同名大类各归各的。
#
# 三条都带「只算已结算」。京东规则表写的是「未结算和不结算的删掉」，本期导出里
# 36,911 行全是已结算，这条筛选眼下一行都不筛，写着是为了哪天真混进来时不用等人发现。
- id: trade_receipt_jd
  name: 销售收入
  source: settlement
  platform: jd
  major: trade_receipt
  value: {op: sum, of: [income]}
  where:
    - {field: bill_status, op: eq, value: 已结算}
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  expect:
    - {field: order_state, op: not_in, value: [已取消]}
  expect_label: 未取消
  note: >
    货款和代收配送费两个科目。收支方向为支出的那些已经在模板里改判成交易退款了，
    所以这一条拿到的都是真收进来的钱。

- id: trade_refund_jd
  name: 销售退款
  occasional: true
  source: settlement
  platform: jd
  major: trade_refund
  value: {op: sum, of: [income]}
  where:
    - {field: bill_status, op: eq, value: 已结算}
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: 来自模板里的改判规则，不是字典。源数据本身是负数，直接用。

- id: software_fee_jd
  name: 平台服务费
  source: settlement
  platform: jd
  major: software_fee
  value: {op: sum, of: [income]}
  where:
    - {field: bill_status, op: eq, value: 已结算}
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: >
    京东叫平台技术服务费，含佣金、交易服务费、商品保险服务费、运费保险服务费、
    综合违约金、随单送的京豆，以及规则表指定并到这里的售后卖家赔付费和返利框架费。
    不设 occasional：这个平台每一单都有佣金和交易服务费，缺了就是对账表没交全。

# --------------------------------------------------------------- 拼多多 --- #
# 口径来自拼多多那张订单明细表的公式。和京东最大的差别是对账那四项都不除 countifs——
# 因为它的订单明细一行就是一个订单，订单号行级唯一，没有可摊的对象。
# 这里仍然写 allocate: even：一个订单只有一行时均摊等于直接挂，而万一哪天导出
# 变成一单多行（换个导出口径就会），直接挂会把同一笔钱在每一行上各记一遍。
- id: trade_receipt_pdd
  name: 销售收入
  source: settlement
  platform: pdd
  major: trade_receipt
  value: {op: sum, of: [income, outgo]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: 交易收入-订单收入，加上优惠券结算那部分。收入列和支出列相加取净额。

- id: trade_refund_pdd
  name: 销售退款
  occasional: true
  source: settlement
  platform: pdd
  major: trade_refund
  value: {op: sum, of: [income, outgo]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}

- id: software_fee_pdd
  name: 平台服务费
  source: settlement
  platform: pdd
  major: software_fee
  value: {op: sum, of: [income, outgo]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: 技术服务费和基础技术服务费。费率很低，本期 7,847 行合计只有 -522.14 元。

- id: trade_compensation_pdd
  name: 交易赔付
  occasional: true
  source: settlement
  platform: pdd
  major: trade_compensation
  value: {op: sum, of: [income, outgo]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: >
    售后费用那一组（运费补偿、售后补偿消费者、延迟发货、虚假发货、缺货、
    发票服务承诺未兑现）加上其他收支那一组（申诉补回、合作费追回）。

# --------------------------------------------------------------- 抖音收支 --- #
# 抖音本来是「一条净额」：销售收入=sumifs(对账表动账金额,子订单号,子订单编号)，
# 不拆费项、不分摊。业务补的新规则把它拆成了和另外四个平台一样的五项，
# 并且挂钩键从子订单号换成主订单号、除以 countifs（即组内均分）：
#
#   交易收款/交易退款/软件服务费/交易赔付/保证金
#     = sumifs(对账表该项, 对账表订单号, 主订单编号) / countifs(主订单编号)
#
# 换成拆项之后，这家店的损益表才和别家可比——原来抖音的「平台费用」整组是空的，
# 界面上看不出它有没有交平台服务费。拆开之后费项归类走字典，那张对照表业务这次
# 一并给了（20 条），和字典里已有的 20 条逐条相同，一条都不用改。
- id: trade_receipt_douyin
  name: 销售收入
  source: settlement
  platform: douyin
  major: trade_receipt
  value: {op: sum, of: [income]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: >
    动账金额自带符号，不取反。挂主订单号、组内均分。

    换成主订单号是有得的：本期按子订单号挂能认领 186 行 3,069.91，按主订单号挂
    认领 188 行 3,111.65，多出来的 41.74 是同一个主订单（6953149768301877000）
    上的两笔——一笔的子订单号是空的，另一笔写的子订单号（…F00）在订单明细里
    没有。这个主订单本身在脊柱上，有 4 个子订单。也就是说这 41.74 是这家店
    真金白银的收款，按子订单挂会漏掉，而漏掉不报错。

- id: trade_refund_douyin
  name: 销售退款
  occasional: true
  source: settlement
  platform: douyin
  major: trade_refund
  value: {op: sum, of: [income]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}

- id: software_fee_douyin
  name: 平台服务费
  occasional: true
  source: settlement
  platform: douyin
  major: software_fee
  value: {op: sum, of: [income]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: 偏远地区物流服务、上门取件运费、权益保险（运费险）三个动账场景。

- id: trade_compensation_douyin
  name: 交易赔付
  occasional: true
  source: settlement
  platform: douyin
  major: trade_compensation
  value: {op: sum, of: [income]}
  sign: as_is
  time_basis: settle_date
  link: {key: base_order_id, to: order.order_id, grain: order}
  allocate: {mode: even}
  note: 消费者赔付、拦截费、欠票扣款、评价有礼那两项、其他费用。

# 业务补的抖音规则里，利润公式还有一项「+保证金」，这里没有对应的指标，是有意的。
#
# 对照表里归到「保证金」这个业务大类的只有一个动账场景：货款充值保证金。它是钱从
# 余额挪进保证金账户，是账户之间挪钱，不是这个月挣了或者花了什么。这类动账不带
# 订单号，而业务那一列本身也是 sumifs 按订单号取的，所以他们表上那一格恒为 0——
# 写成指标只会在抖音的损益表上多出一行永远是 0.00 的「保证金」。
#
# 这个判断和另外两个平台是一致的，不是抖音特例：拼多多的「转账-店铺保证金/活动保证金」
# 同样归在 deposit，本期它和提现合起来 -99,600，混进利润会让那家店从赚一万四变成
# 亏八万五；淘宝那边业务也明确说过「保证金-天猫-扣除转移」不计入费项、
# 「保证金解冻」返回空值。三个平台一个口径：保证金进出不是损益。
#
# 万一哪个月这类动账真的带上了订单号，那笔钱不会凭空消失：字典把它标成天然无订单号，
# 它会出现在「没进利润的钱」里、单独挂在「货款充值保证金」这个名目下。
# 见 tests/test_jd_pdd.py 里那条守着 deposit 不被任何指标消费的测试。

- id: insurance_cost_douyin
  name: 权益保险
  occasional: true
  source: insurance
  platform: douyin
  value: {op: sum, of: [total_cost]}
  sign: negate
  time_basis: settle_date
  link: {key: sub_order_id, to: order.sub_order_id, grain: order}
  note: >
    保费支出表，业务代号 J 表。规则是
    sumifs(J表金额, J表关联子订单号, 子订单编号)——按子订单直挂，没有 countifs，
    所以不分摊。

    本期这张表只有表头、没有数据行。留着模板和指标是因为空表和没有这张表是两件事：
    没有模板时它会被当成认不出来的表拦在门外，而有模板时它是「这个月确实是 0」。

    要留意一处可能重复：对账表里也有一个叫「权益保险」的动账场景，对照表把它
    归到软件服务费（备注写着运费险）。两处同名不同表，本期 J 表为空所以不会重复，
    等 J 表真有数据时要核对一遍是不是同一笔钱记了两次。
