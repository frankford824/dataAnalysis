# 国内电商的数据源清单。
#
# 每一条对应店铺负责人或某个岗位要交的一份表。cadence 决定催办节奏，
# required_for_close 决定它缺了能不能结账，owner_role 决定催谁。
#
# 这份清单是照着实际在用的 9 类文件写的，不是设想出来的。三个平台的差异
# 也在这里体现：1688 没有推广数据（他们的订单明细表里推广费用一列直接补 0），
# 补发成本已经含在聚水潭成本里所以不单独报。

- id: order_detail
  name: 订单明细
  platform: any
  owner_role: shop_owner
  cadence: daily
  is_spine: true
  required_for_close: true
  provides: []
  note: >
    脊柱。一行一个子订单。淘宝从千牛导出宝贝明细，抖音从订单管理导出，
    1688 从已卖出货品导出。所有成本项最终都要挂到这张表的行上。

- id: settlement
  name: 对账（资金流水）
  platform: any
  owner_role: shop_owner
  cadence: daily
  required_for_close: true
  provides: [trade_receipt, trade_refund, software_fee, trade_compensation, marketing_fee]
  note: >
    平台资金账户的逐笔流水，销售收入与各项平台费用都出自这里。
    淘宝有支付宝和微信两个资金渠道，是两张表头不同的表，都要交。

- id: order_cost
  name: 聚水潭成本
  filename_hints: [聚水潭]
  platform: any
  owner_role: warehouse
  cadence: daily
  required_for_close: true
  provides: [goods_cost]
  dedupe_key: [internal_order_id, sku, sub_order_id, quantity]
  note: >
    商品成本的唯一来源。同时是运费表回查订单号的中间表。

    可以交不止一份。业务把第二份叫 K 表（文件名「聚水潭成本（补充）-店名.xlsx」），
    结构和第一份完全一样，走同一个模板。原先以为它是来补空成本价的——2026-08 这批
    真表到手之后核了一遍，不是：五家店的 K 表一共补上了 0 行空成本价。它实际是
    同一段时间的第二次、更全的导出。以淘宝为例，K 表覆盖 05-01~05-13，这段窗口里
    I 表只有 18,543 行而 K 表有 28,972 行，只在 I 表里出现的组仅 26 个——
    第一次导出漏了一大半，K 表才是全的。所以两份必须合并，不能只取一份。

    键取的是「这一行是哪张单子上的哪个商品、几件」。不能只用 (内部订单号, 商品编码)：
    实测淘宝那份里有 2,670 组同单同商品的行（同一商品分几次出库），只按这两列去重
    会把它们当重复删掉，成本少算。加上线上子订单编号和数量之后，一份文件内部只剩
    10 组共 23 行仍然无法区分——而去重只比文件之间，不动一份文件自己内部的重复行，
    所以这 23 行一行都不会丢。

    成本价刻意不进键。它原先在键里，代价是 K 表整个白做了一遍反向的事：聚水潭的
    成本价是移动加权，两次导出之间会被重算，同一条出库记录（内部订单号、线上子订单
    编号、商品编码、数量、状态、快递单号、下单时间全都一样）在 I 表里是 1.6492、
    在 K 表里是 1.65。成本价一进键，这两行就成了两条不同的记录，同一笔成本算两遍。
    这不是推演出来的：把 2026-08 那批表两种键各算一遍损益表，商品成本一项
    淘宝 -272,216.23 → -248,510.95（多算 23,705.28）、1688 -38,123.08 → -32,326.22、
    京东 -29,872.00 → -26,753.68、拼多多 -14,117.96 → -12,849.48、
    抖音 -1,361.62 → -1,333.60，五家合计多算 33,916.96 元。覆盖率一分没动
    （淘宝两种键都是 98.60%）——被去掉的本来就是已经覆盖到的订单的重复行。
    翻倍不会报错，只会让利润凭空少一截，正是这里最该防住的那类错。

    代价是结果变得和文件先后有关：同一条记录留下的是先到那份的成本价。实测这个
    差额很小——淘宝 181.90 元（占 0.05%）、1688 18.32 元、京东 10.99 元、
    拼多多 1.69 元、抖音 0.02 元，因为两次导出之间成本价只动了小数点后几位。
    宁可认一个偏几十块的成本价，也不要把整笔成本记两遍。

- id: freight
  name: 运费
  platform: any
  owner_role: logistics
  cadence: weekly
  required_for_close: true
  provides: [freight_cost]
  dedupe_key: [tracking_no]
  company_wide: true
  note: >
    这张表只有运单号，没有订单号。要先拿运单号去订单明细查物流单号得到主订单编号，
    查不到再去聚水潭查快递单号得到原始线上订单号。实测九成五的行两级都回查不到，
    因为这张表是全公司所有店铺的运单混在一起。

    全公司一张主表，三个店长各交一份，内容完全相同：实测 299,554 个运单号
    在三份文件里 100% 重合，金额都是 550,944.03。不按运单号去重就会算成三倍。
    各店那份只是额外带了自己的关联列（淘宝带订单号、抖音带子订单、1688 没带），
    去重时保留先到的那份即可，关联靠后面的回查链，不依赖这几列。

- id: promotion
  name: 推广
  platform: any
  owner_role: operations
  cadence: daily
  required_for_close: false
  provides: [ad_cost]
  note: >
    商品级，没有订单号，要按商品ID 均分到该商品的订单行上。
    1688 目前没有这份数据。

- id: brushing
  name: 刷单（本金佣金）
  platform: any
  owner_role: operations
  cadence: weekly
  required_for_close: false
  provides: [brushing_cost]
  dedupe_key: [store_name, order_id, principal, commission]
  company_wide: true
  note: >
    从微盘获取，全公司一张表，靠订单号落到店。

    交上来的每一份都混着别家店：淘宝店长交的那份 1,202 行里有 8 家店的写法，
    其中属于喜必顺的只有几十行。不声明公司级的后果不是算错钱——订单号挂不上
    自然就不进这家店的利润——而是界面上这一项的命中率写着 3.9%，看着像整张表
    九成六的数据都出了问题。一列常年通红，人就不再看它，真出问题那天也没人看见。

    去重键取「哪家店、哪张单、本金多少、佣金多少」。实测四份文件 1,206 行
    1,206 个键，没有一行重复，所以这个键是准确的；它防的是哪天两个店长交的
    副本圈到了同一批行——直接拼接会让那部分刷单成本翻倍，而翻倍不报错。

- id: dropship
  name: 代发
  platform: any
  owner_role: operations
  cadence: weekly
  required_for_close: false
  provides: [dropship_cost]
  dedupe_key: [store_name, order_id, total_cost]
  company_wide: true
  note: >
    从微盘获取，全公司一张表，靠订单号落到店。理由与刷单那条相同：
    淘宝店长交的那份 198 行里有 6 家店，命中率 48.5% 是假警报。
    实测四份 233 行 233 个键，没有重复。

- id: reshipment
  name: 补发
  filename_hints: [补发]
  platform: any
  owner_role: warehouse
  cadence: weekly
  required_for_close: false
  provides: [reshipment_cost]
  note: >
    结构与聚水潭成本表相同，是从那张表按订单类型筛出补发订单另存的。
    1688 不单独报，补发成本已含在聚水潭成本里。

- id: insurance
  name: 权益保险（保费支出）
  filename_hints: [权益保险, 保费支出]
  platform: douyin
  owner_role: shop_owner
  cadence: weekly
  required_for_close: false
  provides: [insurance_cost_douyin]
  note: >
    抖店的保费支出流水，业务代号 J 表。一行一笔保费，带关联子订单号，按子订单直挂。

    本期只有表头没有数据行。有模板和没模板不是一回事：没有的话这张表会被当成
    认不出来的表拦下来，交表的人得去处理一张其实没有内容的表；有的话它是
    「这个月保费确实是 0」。

- id: small_payment
  name: 小额打款
  platform: any
  owner_role: operations
  cadence: weekly
  required_for_close: false
  provides: [small_payment_cost]
  dedupe_key: [serial_no]
  company_wide: true
  note: >
    客服给客户的小额补偿。全集团一张表，要按网店名称筛。
    表里的网店（美食专家、淘宝嘻嘻哈哈、京东皇莉诗…）大多不属于我们核算的这三家店，
    说明它覆盖的范围比本模型大，必须先筛店铺再入账。

    三个店长各交一份，内容完全相同：2,659 个序号全部重合，金额都是 94,065.08。
    按序号去重，重复交多少份都是同一个结果。
