# 国内电商的数据源清单。
#
# 每一条对应店铺负责人或某个岗位要交的一份表。cadence 决定催办节奏，
# required_for_close 决定它缺了能不能结账，owner_role 决定催谁。
#
# 这份清单是照着实际在用的 9 类文件写的，不是设想出来的。三个平台的差异
# 也在这里体现：1688 没有推广数据（他们的订单明细表里推广费用一列直接补 0），
# 补发成本已经含在聚水潭成本里所以不单独报。

- id: order_detail
  name: 订单明细
  platform: any
  owner_role: shop_owner
  cadence: daily
  is_spine: true
  required_for_close: true
  provides: []
  note: >
    脊柱。一行一个子订单。淘宝从千牛导出宝贝明细，抖音从订单管理导出，
    1688 从已卖出货品导出。所有成本项最终都要挂到这张表的行上。

- id: settlement
  name: 对账（资金流水）
  platform: any
  owner_role: shop_owner
  cadence: daily
  required_for_close: true
  provides: [trade_receipt, trade_refund, software_fee, trade_compensation, marketing_fee]
  note: >
    平台资金账户的逐笔流水，销售收入与各项平台费用都出自这里。
    淘宝有支付宝和微信两个资金渠道，是两张表头不同的表，都要交。

- id: order_cost
  name: 聚水潭成本
  filename_hints: [聚水潭]
  platform: any
  owner_role: warehouse
  cadence: daily
  required_for_close: true
  provides: [goods_cost]
  dedupe_key: [internal_order_id, sku, sub_order_id, quantity, unit_cost]
  note: >
    商品成本的唯一来源。同时是运费表回查订单号的中间表。

    可以交不止一份：淘宝店有 388 行拿不到成本价——385 行是空的（补差价商品，
    以及被合并/被拆分后成本落到另一张单子上的行），另外 3 行是把商品编码填进了
    成本价那一格。补的办法是再导一份聚水潭。所以这里要去重键——
    第二份万一导成了全量而不是增量，直接拼接会让商品成本翻倍，而翻倍这件事
    不会报错，只会让利润凭空少一半。

    键取的是「这一行是哪张单子上的哪个商品、几件、单价多少」。不能只用
    (内部订单号, 商品编码)：实测淘宝那份里有 2,670 组同单同商品的行（同一商品
    分几次出库），只按这两列去重会把它们当重复删掉，成本少算。加上数量和成本价
    之后，剩下 11 组共 25 行仍然完全相同——那才是真正意义上无法区分的行，
    而它们只出现在同一份文件内部。去重只比文件之间，不动一份文件自己内部的重复行：
    否则「今天多传了一份补充导出」这个动作会把原来那份的成本改小。

- id: freight
  name: 运费
  platform: any
  owner_role: logistics
  cadence: weekly
  required_for_close: true
  provides: [freight_cost]
  dedupe_key: [tracking_no]
  company_wide: true
  note: >
    这张表只有运单号，没有订单号。要先拿运单号去订单明细查物流单号得到主订单编号，
    查不到再去聚水潭查快递单号得到原始线上订单号。实测九成五的行两级都回查不到，
    因为这张表是全公司所有店铺的运单混在一起。

    全公司一张主表，三个店长各交一份，内容完全相同：实测 299,554 个运单号
    在三份文件里 100% 重合，金额都是 550,944.03。不按运单号去重就会算成三倍。
    各店那份只是额外带了自己的关联列（淘宝带订单号、抖音带子订单、1688 没带），
    去重时保留先到的那份即可，关联靠后面的回查链，不依赖这几列。

- id: promotion
  name: 推广
  platform: any
  owner_role: operations
  cadence: daily
  required_for_close: false
  provides: [ad_cost]
  note: >
    商品级，没有订单号，要按商品ID 均分到该商品的订单行上。
    1688 目前没有这份数据。

- id: brushing
  name: 刷单（本金佣金）
  platform: any
  owner_role: operations
  cadence: weekly
  required_for_close: false
  provides: [brushing_cost]
  dedupe_key: [store_name, order_id, principal, commission]
  company_wide: true
  note: >
    从微盘获取，全公司一张表，靠订单号落到店。

    交上来的每一份都混着别家店：淘宝店长交的那份 1,202 行里有 8 家店的写法，
    其中属于喜必顺的只有几十行。不声明公司级的后果不是算错钱——订单号挂不上
    自然就不进这家店的利润——而是界面上这一项的命中率写着 3.9%，看着像整张表
    九成六的数据都出了问题。一列常年通红，人就不再看它，真出问题那天也没人看见。

    去重键取「哪家店、哪张单、本金多少、佣金多少」。实测四份文件 1,206 行
    1,206 个键，没有一行重复，所以这个键是准确的；它防的是哪天两个店长交的
    副本圈到了同一批行——直接拼接会让那部分刷单成本翻倍，而翻倍不报错。

- id: dropship
  name: 代发
  platform: any
  owner_role: operations
  cadence: weekly
  required_for_close: false
  provides: [dropship_cost]
  dedupe_key: [store_name, order_id, total_cost]
  company_wide: true
  note: >
    从微盘获取，全公司一张表，靠订单号落到店。理由与刷单那条相同：
    淘宝店长交的那份 198 行里有 6 家店，命中率 48.5% 是假警报。
    实测四份 233 行 233 个键，没有重复。

- id: reshipment
  name: 补发
  filename_hints: [补发]
  platform: any
  owner_role: warehouse
  cadence: weekly
  required_for_close: false
  provides: [reshipment_cost]
  note: >
    结构与聚水潭成本表相同，是从那张表按订单类型筛出补发订单另存的。
    1688 不单独报，补发成本已含在聚水潭成本里。

- id: insurance
  name: 权益保险（保费支出）
  filename_hints: [权益保险, 保费支出]
  platform: douyin
  owner_role: shop_owner
  cadence: weekly
  required_for_close: false
  provides: [insurance_cost_douyin]
  note: >
    抖店的保费支出流水，业务代号 J 表。一行一笔保费，带关联子订单号，按子订单直挂。

    本期只有表头没有数据行。有模板和没模板不是一回事：没有的话这张表会被当成
    认不出来的表拦下来，交表的人得去处理一张其实没有内容的表；有的话它是
    「这个月保费确实是 0」。

- id: small_payment
  name: 小额打款
  platform: any
  owner_role: operations
  cadence: weekly
  required_for_close: false
  provides: [small_payment_cost]
  dedupe_key: [serial_no]
  company_wide: true
  note: >
    客服给客户的小额补偿。全集团一张表，要按网店名称筛。
    表里的网店（美食专家、淘宝嘻嘻哈哈、京东皇莉诗…）大多不属于我们核算的这三家店，
    说明它覆盖的范围比本模型大，必须先筛店铺再入账。

    三个店长各交一份，内容完全相同：2,659 个序号全部重合，金额都是 94,065.08。
    按序号去重，重复交多少份都是同一个结果。
