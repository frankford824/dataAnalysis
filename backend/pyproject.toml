[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-analytics-backend"
version = "0.1.0"
description = "Enterprise-scoped deterministic commerce analytics API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.34,<2",
  "cryptography>=42,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0.36,<3",
  "sqlglot>=26,<28",
  "uvicorn[standard]>=0.34,<1",
  "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
legacy-engine = [
  "celery[redis]>=5.4,<6",
  "duckdb>=1.1,<2",
  "fastexcel>=0.12,<1",
  "polars>=1.17,<2",
  "pyarrow>=18,<22",
]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "commerce-analytics-backend[legacy-engine]",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -s --disable-warnings"

[tool.coverage.run]
source = ["app"]
