[package]
name = "commerce-analytics-desktop"
version = "0.1.0"
description = "Commerce Analytics desktop client"
edition = "2021"

[lib]
name = "commerce_analytics_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
notify = "7"
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
