[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "commerce-reconciliation-harness"
version = "0.1.0"
description = "电商财务确定性核对 Harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "polars>=1.20,<2",
  "pyarrow>=18,<22",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
fa-harness = "commerce_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["commerce_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires DuckDB or local filesystem integration",
  "finance_win: requires explicit read-only finance-win access",
]

[tool.coverage.run]
branch = true
source = ["commerce_harness"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "finance_agent",
  "finance_agent.*",
  "openpyxl",
  "openpyxl.*",
  "pyarrow",
  "pyarrow.*",
]
ignore_missing_imports = true
