server {
    listen 8080;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Browser-supplied identity assertions are never trusted. Authentication
        # is the secure session cookie or Bearer token handled by the API.
        proxy_set_header X-Enterprise-ID "";
        proxy_set_header X-User-ID "";
        proxy_set_header X-Role "";
        proxy_set_header X-Store-IDs "";
        proxy_set_header X-Trusted-Proxy-User "";
        proxy_set_header X-Trusted-Proxy-Timestamp "";
        proxy_set_header X-Trusted-Proxy-Signature "";
        proxy_read_timeout 120s;
        client_max_body_size 2g;
    }

    location /superset/ {
        proxy_pass http://superset:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
