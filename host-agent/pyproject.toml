[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "finance-host-agent"
version = "0.1.0"
description = "电商对账控制面的外置只读采集与确定性计算代理"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "polars>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
finance-agent = "finance_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["finance_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["finance_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "openpyxl",
  "openpyxl.*",
]
ignore_missing_imports = true
